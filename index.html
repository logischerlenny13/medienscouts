<!DOCTYPE html>
<html lang="de" class="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schulportal · Digitale Hilfe & Medienscouts</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/lucide@0.383.0"></script>
<style type="text/tailwindcss">
.glass{@apply bg-white/85 dark:bg-slate-900/85 backdrop-blur-xl border border-slate-200/80 dark:border-slate-800 rounded-2xl shadow-sm}
.inp{@apply w-full rounded-xl px-3.5 py-2.5 bg-white dark:bg-slate-800/90 border border-slate-300 dark:border-slate-700 outline-none focus:ring-2 ring-blue-600 text-sm transition}
.btn{@apply inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold transition disabled:opacity-50 cursor-pointer shadow-sm}
.btn2{@apply inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl bg-slate-200/70 dark:bg-slate-800 hover:bg-slate-300/70 dark:hover:bg-slate-700 text-xs font-medium transition cursor-pointer}
.tab{@apply px-3.5 py-2 rounded-xl text-sm font-medium hover:bg-blue-500/10 transition cursor-pointer}
.tab.on{@apply bg-blue-600 text-white shadow-sm}
.prose p{margin:.6rem 0;line-height:1.6}.prose h3{font-weight:700;font-size:1.15rem;margin-top:1.2rem;margin-bottom:.4rem}.prose ul{list-style:disc;padding-left:1.4rem;margin:.6rem 0}
</style>
</head>
<body class="min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 bg-cover bg-center bg-fixed transition-colors">
<div id="bg-overlay" class="min-h-screen flex flex-col">
  <div id="app" class="flex-1 flex flex-col"></div>
</div>
<div id="modal"></div>
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[100]"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyAheWnI7RFPl9h0C0rGy_6-l5liyNsMKzc",authDomain:"medienscoutswebseite.firebaseapp.com",projectId:"medienscoutswebseite",storageBucket:"medienscoutswebseite.firebasestorage.app",messagingSenderId:"731139325748",appId:"1:731139325748:web:a67d05e3ae067a4e266f61"};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);

// ---------- Datenschicht ----------
const DB={
  watch:(col,cb,order)=>onSnapshot(order?query(collection(db,col),orderBy(order,'desc')):collection(db,col),s=>cb(s.docs.map(d=>({id:d.id,...d.data()})))),
  watchMy:(col,uid,cb)=>onSnapshot(query(collection(db,col),where('uid','==',uid)),s=>cb(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt)))),
  add:(col,d)=>addDoc(collection(db,col),d),
  set:(col,id,d)=>setDoc(doc(db,col,id),d),
  upd:(col,id,d)=>updateDoc(doc(db,col,id),d),
  del:(col,id)=>deleteDoc(doc(db,col,id)),
  get:async(col,id)=>{const s=await getDoc(doc(db,col,id));return s.exists()?{id:s.id,...s.data()}:null},
  msgs:(id,cb)=>onSnapshot(query(collection(db,'tickets',id,'messages'),orderBy('ts')),s=>cb(s.docs.map(d=>d.data()))),
  addMsg:(id,m)=>addDoc(collection(db,'tickets',id,'messages'),m)
};

const S={
  settings:{tickets:true,apps:true,allowReg:true,schoolName:'Schulportal · Digitale Hilfe',subTitle:'Anleitungen, Artikel & direkter Support der Medienscouts',logo:'',bg:''},
  needSetup:false,videos:[],articles:[],tickets:[],apps:[],myTickets:[],myApps:[],users:[],
  user:null,view:'home',adminTab:'settings',authMode:'login',q:'',cat:'Alle',typeFilter:'Alle',edit:null,open:null,unsubs:[]
};

const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{$('#toast').innerHTML=`<div class="glass px-4 py-2.5 text-sm font-medium shadow-xl border-blue-500/30">${esc(t)}</div>`;setTimeout(()=>$('#toast').innerHTML='',3200)};
const icons=()=>lucide.createIcons();
const val=id=>$('#'+id)?.value.trim()||'';
const fmt=ts=>new Date(ts).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'});
const ytId=u=>{const m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:/^[\w-]{11}$/.test(u)?u:null};
const CATS=['Cybermobbing','Datenschutz','Passwörter & Sicherheit','Social Media','Schul-IT & Accounts','Sonstiges'];

const compress=(f,max=1000,q=0.75)=>new Promise((res,rej)=>{
  const r=new FileReader();r.onerror=rej;
  r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};i.onerror=rej;i.src=r.result};
  r.readAsDataURL(f);
});

const fmtArticle=t=>String(t||'').split(/\n\s*\n/).map(b=>{
  const l=b.split('\n');
  if(l.every(x=>/^[-*] /.test(x)))return'<ul>'+l.map(x=>`<li>${esc(x.slice(2))}</li>`).join('')+'</ul>';
  if(/^## /.test(b))return`<h3>${esc(b.slice(3))}</h3>`;
  return`<p>${esc(b).replace(/\n/g,'<br>')}</p>`;
}).join('');

const isStaff=()=>S.user&&['Admin','Medienscout'].includes(S.user.role);

// ---------- Live-Abos ----------
onSnapshot(doc(db,'settings','main'),s=>{
  S.needSetup=!s.exists()||!s.data().setupDone;
  if(s.exists())S.settings={...S.settings,...s.data()};
  applyDesign();render();
},()=>render());

DB.watch('videos',d=>{S.videos=d;render()},'createdAt');
DB.watch('articles',d=>{S.articles=d;render()},'createdAt');

onAuthStateChanged(auth,async u=>{
  S.unsubs.forEach(f=>f());S.unsubs=[];
  if(!u){S.user=null;S.myTickets=[];S.myApps=[];if(S.view!='home')S.view='home';render();return}
  let p=await DB.get('users',u.uid);
  if(!p){
    p={email:u.email,name:u.email.split('@')[0],role:'Schüler',createdAt:Date.now()};
    await DB.set('users',u.uid,p);
  }
  S.user={uid:u.uid,...p};
  if(S.open=='login')closeModal();

  // Eigene Tickets & Bewerbungen immer abonnieren
  S.unsubs.push(DB.watchMy('tickets',u.uid,d=>{S.myTickets=d;render()}));
  S.unsubs.push(DB.watchMy('applications',u.uid,d=>{S.myApps=d;render()}));

  // Wenn Admin oder Medienscout: Alle Daten abonnieren
  if(['Admin','Medienscout'].includes(p.role)){
    const w=(c,k,o)=>S.unsubs.push(DB.watch(c,d=>{S[k]=d;render()},o));
    w('tickets','tickets','updatedAt');
    w('applications','apps','createdAt');
    w('users','users');
  }
  render();
});

function applyDesign(){
  document.body.style.backgroundImage=S.settings.bg?`url(${S.settings.bg})`:'none';
  $('#bg-overlay').className=S.settings.bg?'min-h-screen flex flex-col bg-slate-100/80 dark:bg-slate-950/85 backdrop-blur-sm':'min-h-screen flex flex-col';
}

// ---------- Rendering ----------
function render(){
  const ae=document.activeElement;
  if(ae&&ae.tagName!='BODY'&&ae.closest('#app')&&['INPUT','TEXTAREA','SELECT'].includes(ae.tagName)&&!ae.id.startsWith('s-'))return;
  $('#app').innerHTML=nav()+`<main class="max-w-5xl w-full mx-auto px-4 py-8 flex-1">${ S.view=='admin'&&isStaff() ? adminView() : S.view=='tickets'&&S.user ? studentTicketsView() : S.view=='apply'&&S.user ? studentApplyView() : homeView() }</main>`+footer();
  icons();
}

const nav=()=>`<header class="sticky top-0 z-40 glass !rounded-none border-x-0 border-t-0">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-3">
    <button onclick="S.view='home';render()" class="font-bold text-base sm:text-lg flex items-center gap-2.5 text-left">
      ${S.settings.logo?`<img src="${S.settings.logo}" class="h-8 w-8 rounded-lg object-contain bg-white/10">`:`<div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center"><i data-lucide="graduation-cap" class="w-5 h-5"></i></div>`}
      <div>
        <div class="leading-tight">${esc(S.settings.schoolName)}</div>
        <div class="text-[11px] font-normal opacity-60 hidden sm:block">Unterstützt durch die Medienscouts</div>
      </div>
    </button>

    <div class="ml-auto flex items-center gap-2">
      <button class="btn2" onclick="S.view='home';render()" title="Startseite"><i data-lucide="book-open" class="w-4 h-4"></i><span class="hidden md:inline">Artikel & Videos</span></button>
      ${S.settings.tickets?`<button class="btn2 ${S.view=='tickets'?'!bg-blue-600 !text-white':''}" onclick="goProtected('tickets')"><i data-lucide="message-square-text" class="w-4 h-4"></i><span class="hidden sm:inline">Meine Tickets</span></button>`:''}
      ${S.settings.apps?`<button class="btn2 ${S.view=='apply'?'!bg-blue-600 !text-white':''}" onclick="goProtected('apply')"><i data-lucide="user-plus" class="w-4 h-4"></i><span class="hidden sm:inline">Bewerbung</span></button>`:''}
      ${isStaff()?`<button class="btn2 ${S.view=='admin'?'!bg-blue-600 !text-white':''}" onclick="S.view='admin';render()"><i data-lucide="shield" class="w-4 h-4 text-blue-500 ${S.view=='admin'?'!text-white':''}"></i><span>Admin</span></button>`:''}
      <button class="btn2" onclick="document.documentElement.classList.toggle('dark')" title="Design wechseln"><i data-lucide="sun-moon" class="w-4 h-4"></i></button>
      ${S.user
        ? `<div class="flex items-center gap-1.5 pl-1 border-l border-slate-300 dark:border-slate-700">
             <span class="hidden lg:inline text-xs font-medium px-2">${esc(S.user.name)}</span>
             <button class="btn2 !text-rose-500" onclick="logout()" title="Abmelden"><i data-lucide="log-out" class="w-4 h-4"></i></button>
           </div>`
        : `<button class="btn !py-2 !px-3.5" onclick="openAuth('login')"><i data-lucide="user" class="w-4 h-4"></i>Anmelden</button>`}
    </div>
  </div>
</header>`;

const footer=()=>`<footer class="text-center text-xs opacity-60 py-6 border-t border-slate-200/60 dark:border-slate-800/60 mt-12">${esc(S.settings.schoolName)} · Schulportal & Medienscouts</footer>`;

// ---------- Öffentliche Startseite (Schul-Look, Fokus auf Wissen + Aktions-Karten unten) ----------
function homeView(){
  return `<div class="space-y-10">
    <!-- Dezenter Schul-Header -->
    <section class="glass p-6 sm:p-8 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 border-l-4 border-l-blue-600">
      <div>
        <span class="text-xs font-semibold uppercase tracking-wider text-blue-600 dark:text-blue-400">Informationen & Selbsthilfe</span>
        <h1 class="text-2xl sm:text-3xl font-bold mt-1">${esc(S.settings.schoolName)}</h1>
        <p class="text-sm opacity-75 mt-1">${esc(S.settings.subTitle)}</p>
      </div>
      <div class="flex flex-wrap gap-2">
        ${S.settings.tickets?`<button class="btn" onclick="goProtected('tickets')"><i data-lucide="message-square-plus" class="w-4 h-4"></i>Hilfe-Ticket öffnen</button>`:''}
        ${S.settings.apps?`<button class="btn2 !py-2.5 !px-4" onclick="goProtected('apply')"><i data-lucide="user-plus" class="w-4 h-4"></i>Bei den Medienscouts mitmachen</button>`:''}
      </div>
    </section>

    <!-- Kombinierter Bereich: Artikel, Anleitungen & Videos -->
    <section class="space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <h2 class="text-xl font-bold flex items-center gap-2"><i data-lucide="library" class="w-5 h-5 text-blue-600"></i>Artikel, Anleitungen & Videos</h2>
        <div class="flex gap-2">
          <div class="relative flex-1 sm:w-64">
            <input id="s-q" class="inp !pl-9" placeholder="Thema suchen…" value="${esc(S.q)}" oninput="S.q=this.value;updateFeed()">
            <i data-lucide="search" class="w-4 h-4 opacity-50 absolute left-3 top-3"></i>
          </div>
          <select id="s-type" class="inp !w-auto" onchange="S.typeFilter=this.value;updateFeed()">
            ${['Alle','Artikel','Videos'].map(t=>`<option ${S.typeFilter==t?'selected':''}>${t}</option>`).join('')}
          </select>
        </div>
      </div>

      <div class="flex flex-wrap gap-1.5">
        ${['Alle',...CATS].map(c=>`<button class="tab !text-xs !py-1.5 !px-3 ${S.cat==c?'on':''}" onclick="S.cat='${c}';render()">${c}</button>`).join('')}
      </div>

      <div id="feed-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 pt-2">
        ${feedItems()}
      </div>
    </section>

    <!-- Untere Aktions-Boxen (Account-pflichtig, klar & minimalistisch) -->
    <section class="pt-4 border-t border-slate-200 dark:border-slate-800">
      <h2 class="text-lg font-bold mb-4">Persönlicher Bereich (mit Schul-Account)</h2>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="glass p-6 flex flex-col justify-between gap-4">
          <div class="space-y-2">
            <div class="w-10 h-10 rounded-xl bg-blue-500/10 text-blue-600 dark:text-blue-400 flex items-center justify-center"><i data-lucide="messages-square" class="w-5 h-5"></i></div>
            <h3 class="font-bold text-lg">Ticket schreiben & Live-Chat</h3>
            <p class="text-sm opacity-75">Du hast ein Problem auf Social Media, mit deinem Schul-Account oder brauchst Rat? Schreib uns direkt über dein Konto und chatte mit einem Medienscout.</p>
          </div>
          ${S.settings.tickets
            ? `<button class="btn w-full sm:w-fit" onclick="goProtected('tickets')"><i data-lucide="arrow-right" class="w-4 h-4"></i>${S.user?'Zu meinen Tickets':'Anmelden & Ticket schreiben'}</button>`
            : `<div class="text-xs text-amber-500 font-medium flex items-center gap-1.5"><i data-lucide="clock" class="w-4 h-4"></i>Das Ticket-System ist aktuell deaktiviert.</div>`}
        </div>

        <div class="glass p-6 flex flex-col justify-between gap-4">
          <div class="space-y-2">
            <div class="w-10 h-10 rounded-xl bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center"><i data-lucide="award" class="w-5 h-5"></i></div>
            <h3 class="font-bold text-lg">Als Medienscout bewerben</h3>
            <p class="text-sm opacity-75">Du kennst dich gut mit Apps, Games oder Technik aus und möchtest Mitschülern helfen? Bewirb dich direkt mit deinem Schul-Account für unser Team.</p>
          </div>
          ${S.settings.apps
            ? `<button class="btn2 !py-2.5 !px-4 w-full sm:w-fit" onclick="goProtected('apply')"><i data-lucide="user-check" class="w-4 h-4"></i>${S.user?'Zur Bewerbung':'Anmelden & bewerben'}</button>`
            : `<div class="text-xs text-amber-500 font-medium flex items-center gap-1.5"><i data-lucide="clock" class="w-4 h-4"></i>Die Bewerbungsphase ist aktuell geschlossen.</div>`}
        </div>
      </div>
    </section>
  </div>`;
}

function feedItems(){
  const q=S.q.toLowerCase();
  const arts=S.typeFilter=='Videos'?[]:S.articles.filter(a=>a.published!==false&&(S.cat=='Alle'||a.cat==S.cat)&&(a.title+a.body).toLowerCase().includes(q)).map(a=>({...a,_type:'art'}));
  const vids=S.typeFilter=='Artikel'?[]:S.videos.filter(v=>v.published!==false&&(S.cat=='Alle'||(v.cat||'Sonstiges')==S.cat)&&(v.title+v.desc).toLowerCase().includes(q)).map(v=>({...v,_type:'vid'}));
  const all=[...arts,...vids].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

  if(!all.length)return `<div class="glass p-8 text-center opacity-60 sm:col-span-2 lg:col-span-3">Keine passenden Beiträge oder Videos gefunden.</div>`;

  return all.map(item=>item._type=='vid'
    ? `<div class="glass overflow-hidden flex flex-col justify-between">
         <div>
           <div class="aspect-video bg-black"><iframe class="w-full h-full" src="https://www.youtube.com/embed/${esc(item.vid)}" allowfullscreen loading="lazy"></iframe></div>
           <div class="p-4">
             <div class="flex items-center gap-2 mb-1.5">
               <span class="text-[11px] font-medium px-2 py-0.5 rounded-md bg-red-500/15 text-red-500 flex items-center gap-1"><i data-lucide="play" class="w-3 h-3"></i>Video</span>
               <span class="text-[11px] opacity-60">${esc(item.cat||'Allgemein')}</span>
             </div>
             <h3 class="font-bold text-base">${esc(item.title)}</h3>
             <p class="text-xs opacity-75 mt-1 line-clamp-2">${esc(item.desc)}</p>
           </div>
         </div>
       </div>`
    : `<button onclick="openArt('${item.id}')" class="glass p-5 text-left hover:border-blue-500/50 transition flex flex-col justify-between">
         <div>
           <div class="flex items-center gap-2 mb-2">
             <span class="text-[11px] font-medium px-2 py-0.5 rounded-md bg-blue-500/15 text-blue-600 dark:text-blue-400">Anleitung / Artikel</span>
             <span class="text-[11px] opacity-60">${esc(item.cat)}</span>
           </div>
           <h3 class="font-bold text-base">${esc(item.title)}</h3>
           <p class="text-xs opacity-75 mt-2 line-clamp-3 leading-relaxed">${esc(item.body.replace(/#/g,'').slice(0,150))}…</p>
         </div>
         <div class="text-xs text-blue-600 dark:text-blue-400 font-medium mt-4 flex items-center gap-1">Weiterlesen <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></div>
       </button>`
  ).join('');
}
window.updateFeed=()=>{$('#feed-grid').innerHTML=feedItems();icons()};

// ---------- Schüler-Ansicht: Meine Tickets & Neues Ticket ----------
const badge=s=>`<span class="text-xs font-medium px-2.5 py-0.5 rounded-full ${{Neu:'bg-blue-500/15 text-blue-500','In Bearbeitung':'bg-amber-500/15 text-amber-500','Gelöst':'bg-emerald-500/15 text-emerald-500','Offen':'bg-blue-500/15 text-blue-500','Angenommen':'bg-emerald-500/15 text-emerald-500','Abgelehnt':'bg-rose-500/15 text-rose-500'}[s]||'bg-slate-500/20'}">${esc(s)}</span>`;

function studentTicketsView(){
  if(!S.settings.tickets)return `<div class="glass p-6 text-amber-500">Das Ticket-System ist momentan deaktiviert.</div>`;
  return `<div class="space-y-6">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold">Meine Support-Tickets</h1>
        <p class="text-sm opacity-75">Alle deine Anfragen sind fest in deinem Account gespeichert.</p>
      </div>
      <button class="btn2" onclick="S.view='home';render()"><i data-lucide="arrow-left" class="w-4 h-4"></i>Zurück</button>
    </div>

    <div class="grid lg:grid-cols-5 gap-6">
      <!-- Neues Ticket erstellen -->
      <div class="glass p-5 space-y-3 lg:col-span-2 h-fit">
        <h2 class="font-bold text-base flex items-center gap-2"><i data-lucide="plus-circle" class="w-4 h-4 text-blue-500"></i>Neues Ticket starten</h2>
        <div>
          <label class="text-xs opacity-70 block mb-1">Thema / Kategorie</label>
          <select id="t-cat" class="inp">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
        </div>
        <div>
          <label class="text-xs opacity-70 block mb-1">Betreff (kurz)</label>
          <input id="t-subj" class="inp" placeholder="z.B. Frage zu Instagram-Account">
        </div>
        <div>
          <label class="text-xs opacity-70 block mb-1">Deine Nachricht</label>
          <textarea id="t-msg" rows="4" class="inp" placeholder="Beschreibe kurz, wobei wir dir helfen können…"></textarea>
        </div>
        <div id="t-prev"></div>
        <div class="flex items-center justify-between pt-1">
          <label class="btn2"><i data-lucide="image" class="w-4 h-4"></i>Screenshot<input type="file" accept="image/*" hidden onchange="pick(this,'t-prev')"></label>
          <button class="btn" onclick="createTicket()"><i data-lucide="send" class="w-4 h-4"></i>Ticket öffnen</button>
        </div>
      </div>

      <!-- Ticket-Liste des Schülers -->
      <div class="space-y-3 lg:col-span-3">
        <h2 class="font-bold text-base">Bisherige Unterhaltungen (${S.myTickets.length})</h2>
        ${S.myTickets.map(t=>`<button onclick="openChat('${t.id}',false)" class="glass w-full p-4 text-left hover:border-blue-500/50 transition flex items-center justify-between gap-3">
          <div class="space-y-1">
            <div class="flex items-center gap-2">
              <span class="font-bold text-sm">${esc(t.subject||t.category)}</span>
              ${badge(t.status)}
              ${t.unreadStudent?`<span class="text-[11px] bg-blue-600 text-white px-2 py-0.5 rounded-full">Neue Antwort</span>`:''}
            </div>
            <div class="text-xs opacity-60">${esc(t.category)} · Letzte Aktivität: ${fmt(t.updatedAt||t.createdAt)}</div>
          </div>
          <i data-lucide="message-circle" class="w-5 h-5 text-blue-500 shrink-0"></i>
        </button>`).join('') || `<div class="glass p-8 text-center opacity-60 text-sm">Du hast noch keine Tickets erstellt.</div>`}
      </div>
    </div>
  </div>`;
}

// ---------- Schüler-Ansicht: Bewerbung ----------
function studentApplyView(){
  if(!S.settings.apps)return `<div class="glass p-6 text-amber-500">Die Bewerbungsphase ist aktuell geschlossen.</div>`;
  const existing=S.myApps[0];
  return `<div class="max-w-2xl mx-auto space-y-6">

// ---------- Normaler Login / Registrierung Modal ----------
window.goProtected=target=>{
  if(!S.user){S.pendingView=target;openAuth('login');return}
  S.view=target;render();
};

const modal=h=>{$('#modal').innerHTML=`<div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4" onclick="if(event.target==this)closeModal()"><div class="glass !bg-white dark:!bg-slate-900 w-full max-w-xl max-h-[90vh] overflow-auto p-6 relative">${h}</div></div>`;icons()};
let unsubMsg=null;
window.closeModal=()=>{S.open=null;unsubMsg&&unsubMsg();unsubMsg=null;$('#modal').innerHTML=''};

window.openArt=id=>{
  const a=S.articles.find(x=>x.id==id);if(!a)return;
  S.open='art';
  modal(`<button class="absolute top-4 right-4 btn2" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button>
    <span class="text-xs font-medium px-2.5 py-0.5 rounded-md bg-blue-500/15 text-blue-500">${esc(a.cat)}</span>
    <h2 class="text-2xl font-bold mt-2">${esc(a.title)}</h2>
    <div class="text-xs opacity-50 mt-1">Veröffentlicht am ${fmt(a.createdAt)}</div>
    <div class="prose mt-4 border-t border-slate-200 dark:border-slate-800 pt-4 text-sm">${fmtArticle(a.body)}</div>`);
};

window.openAuth=(mode='login')=>{
  S.authMode=mode;S.open='login';
  const regAllowed=S.settings.allowReg;
  modal(`<button class="absolute top-4 right-4 btn2" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button>
    <div class="max-w-sm mx-auto py-2 space-y-5">
      <div class="text-center space-y-1">
        <div class="w-11 h-11 rounded-2xl bg-blue-600 text-white flex items-center justify-center mx-auto mb-2"><i data-lucide="user-check" class="w-6 h-6"></i></div>
        <h2 class="text-xl font-bold">${mode=='login'?'Bei deinem Schul-Account anmelden':'Neues Konto erstellen'}</h2>
        <p class="text-xs opacity-70">Melde dich mit deiner Schul-E-Mail-Adresse an, um Tickets zu schreiben oder dich zu bewerben.</p>
      </div>

      ${regAllowed?`<div class="grid grid-cols-2 p-1 rounded-xl bg-slate-200/70 dark:bg-slate-800 text-xs font-medium">
        <button class="py-2 rounded-lg ${mode=='login'?'bg-white dark:bg-slate-900 shadow-xs':''}" onclick="openAuth('login')">Anmelden</button>
        <button class="py-2 rounded-lg ${mode=='reg'?'bg-white dark:bg-slate-900 shadow-xs':''}" onclick="openAuth('reg')">Registrieren</button>
      </div>`:''}

      <div class="space-y-3">
        ${mode=='reg'?`<div><label class="text-xs opacity-70 block mb-1">Vor- und Nachname</label><input id="l-name" class="inp" placeholder="Max Mustermann"></div>`:''}
        <div>
          <label class="text-xs opacity-70 block mb-1">E-Mail-Adresse</label>
          <input id="l-mail" type="email" class="inp" placeholder="name@schule.de" value="${S.needSetup?'admin@schule.de':''}">
        </div>
        <div>
          <label class="text-xs opacity-70 block mb-1">Passwort</label>
          <input id="l-pw" type="password" class="inp" placeholder="••••••••" value="${S.needSetup?'scout123':''}" onkeydown="if(event.key=='Enter')submitAuth()">
        </div>
        <button class="btn w-full" onclick="submitAuth()">${mode=='login'?'Anmelden':'Konto erstellen'}</button>
      </div>

      ${S.needSetup?`<div class="p-3.5 rounded-xl bg-amber-500/15 border border-amber-500/30 text-xs space-y-2">
        <b>Ersteinrichtung:</b> Noch kein Admin-Konto in der Datenbank. Klicke hier, um mit der E-Mail oben den ersten Haupt-Admin anzulegen:
        <button class="btn w-full !bg-amber-600 hover:!bg-amber-500" onclick="setup()">Ersten Admin & Startdaten anlegen</button>
      </div>`:''}
    </div>`);
};

window.submitAuth=async()=>{
  const email=val('l-mail'),pw=val('l-pw'),name=val('l-name');
  if(!email||!pw)return toast('Bitte E-Mail und Passwort eingeben.');
  try{
    if(S.authMode=='reg'){
      if(!S.settings.allowReg)return toast('Selbst-Registrierung ist deaktiviert.');
      if(!name)return toast('Bitte gib deinen Namen an.');
      const c=await createUserWithEmailAndPassword(auth,email,pw);
      await DB.set('users',c.user.uid,{email,name,role:'Schüler',createdAt:Date.now()});
    }else{
      await signInWithEmailAndPassword(auth,email,pw);
    }
    closeModal();
    if(S.pendingView){S.view=S.pendingView;S.pendingView=null;render()}
  }catch(e){toast('Anmeldung fehlgeschlagen ('+e.code+')')}
};
window.logout=()=>signOut(auth);

// ---------- Ticket & Chat System ----------
let pendingImg={};
window.pick=async(inp,prev,max=900)=>{
  if(!inp.files[0])return;
  pendingImg[prev]=await compress(inp.files[0],max);
  $('#'+prev).innerHTML=`<div class="relative inline-block mt-1"><img src="${pendingImg[prev]}" class="h-20 rounded-lg border border-slate-500/30"><button class="btn2 !p-1 absolute -top-2 -right-2" onclick="pendingImg['${prev}']=null;$('#${prev}').innerHTML=''"><i data-lucide="x" class="w-3 h-3"></i></button></div>`;
  inp.value='';icons();
};
window.zoom=s=>{const d=document.createElement('div');d.className='fixed inset-0 z-[90] bg-black/90 flex items-center justify-center p-4 cursor-zoom-out';d.onclick=()=>d.remove();d.innerHTML=`<img src="${s}" class="max-w-full max-h-full rounded-lg">`;document.body.appendChild(d)};

window.createTicket=async()=>{
  const subj=val('t-subj'),msg=val('t-msg'),cat=val('t-cat');
  if(!subj||!msg)return toast('Bitte Betreff und Nachricht ausfüllen.');
  const now=Date.now();
  const ref=await DB.add('tickets',{
    uid:S.user.uid,userName:S.user.name,userEmail:S.user.email,
    subject:subj,category:cat,status:'Neu',createdAt:now,updatedAt:now,unreadAdmin:true,unreadStudent:false
  });
  await DB.addMsg(ref.id,{from:'student',senderName:S.user.name,text:msg,img:pendingImg['t-prev']||null,ts:now});
  pendingImg['t-prev']=null;
  toast('Ticket wurde erstellt.');
  openChat(ref.id,false);
};

window.openChat=async(id,asAdmin)=>{
  const t=await DB.get('tickets',id).catch(()=>null);if(!t)return toast('Ticket nicht gefunden.');
  S.open='chat';pendingImg['c-prev']=null;
  if(asAdmin&&t.unreadAdmin)DB.upd('tickets',id,{unreadAdmin:false});
  if(!asAdmin&&t.unreadStudent)DB.upd('tickets',id,{unreadStudent:false});

  modal(`<button class="absolute top-4 right-4 btn2" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button>
    <div class="space-y-3 pr-8">
      <div class="flex items-center gap-2 flex-wrap">
        <h2 class="text-lg font-bold">${esc(t.subject||t.category)}</h2>
        <span id="c-st">${badge(t.status)}</span>
      </div>
      <div class="text-xs opacity-70 flex flex-wrap gap-3 items-center">
        <span>Kategorie: <b>${esc(t.category)}</b></span>
        <span>Schüler: <b>${esc(t.userName||'Unbekannt')}</b> (${esc(t.userEmail||'-')})</span>
        ${asAdmin?`<select class="inp !w-auto !py-1 !px-2 text-xs ml-auto" onchange="updStatus('${id}',this.value)">${['Neu','In Bearbeitung','Gelöst'].map(s=>`<option ${s==t.status?'selected':''}>${s}</option>`).join('')}</select>`:''}
      </div>
    </div>

    <div id="c-list" class="h-80 overflow-y-auto space-y-2.5 p-3 my-3 rounded-xl bg-slate-100 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800"></div>
    <div id="c-prev"></div>
    <div class="flex gap-2">
      <label class="btn2 shrink-0" title="Screenshot anhängen"><i data-lucide="image" class="w-4 h-4"></i><input type="file" accept="image/*" hidden onchange="pick(this,'c-prev')"></label>
      <input id="s-c-msg" class="inp" placeholder="Nachricht schreiben…" onkeydown="if(event.key=='Enter')sendMsg('${id}',${asAdmin})">
      <button class="btn shrink-0" onclick="sendMsg('${id}',${asAdmin})"><i data-lucide="send" class="w-4 h-4"></i></button>
    </div>`);

  unsubMsg&&unsubMsg();
  unsubMsg=DB.msgs(id,ms=>{
    const l=$('#c-list');if(!l)return;
    const mySide=asAdmin?'scout':'student';
    l.innerHTML=ms.map(m=>`<div class="flex ${m.from==mySide?'justify-end':'justify-start'}">
      <div class="max-w-[82%] px-3.5 py-2.5 rounded-2xl text-sm ${m.from==mySide?'bg-blue-600 text-white':'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700'}">
        <div class="text-[10px] opacity-75 mb-0.5 font-medium">${esc(m.senderName||(m.from=='scout'?'Medienscout':'Schüler'))} · ${fmt(m.ts)}</div>
        ${m.text?`<div>${esc(m.text).replace(/\n/g,'<br>')}</div>`:''}
        ${m.img?`<img src="${m.img}" onclick="zoom(this.src)" class="mt-2 rounded-lg max-h-44 cursor-zoom-in border border-white/20">`:''}
      </div>
    </div>`).join('');
    l.scrollTop=l.scrollHeight;
  });
};

window.updStatus=async(id,st)=>{await DB.upd('tickets',id,{status:st,updatedAt:Date.now()});$('#c-st').innerHTML=badge(st)};
window.sendMsg=async(id,asAdmin)=>{
  const text=val('s-c-msg'),img=pendingImg['c-prev']||null;if(!text&&!img)return;
  const now=Date.now();
  await DB.addMsg(id,{from:asAdmin?'scout':'student',senderName:S.user.name+(asAdmin?' (Scout)':''),text,img,ts:now});
  await DB.upd('tickets',id,asAdmin?{updatedAt:now,unreadStudent:true,unreadAdmin:false,status:'In Bearbeitung'}:{updatedAt:now,unreadAdmin:true,unreadStudent:false});
  $('#s-c-msg').value='';pendingImg['c-prev']=null;$('#c-prev').innerHTML='';
};

window.sendApp=async()=>{
  const n=val('a-name'),c=val('a-class'),m=val('a-mot');
  if(!n||!c||!m)return toast('Bitte alle Felder ausfüllen.');
  await DB.add('applications',{uid:S.user.uid,email:S.user.email,name:n,klass:c,motivation:m,status:'Offen',createdAt:Date.now()});
  toast('Deine Bewerbung wurde gespeichert!');
};

      </button>
      <button class="btn2" onclick="openChat('${t.id}',true)"><i data-lucide="message-square" class="w-4 h-4"></i>Chat öffnen</button>
      <button class="btn2 !text-rose-500" onclick="delItem('tickets','${t.id}')" title="Ticket löschen"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
    </div>`).join('')||'<div class="glass p-8 text-center opacity-60">Keine Tickets vorhanden.</div>'}
  </div>`,

  apps:()=>`<div class="space-y-3">
    ${S.apps.map(a=>`<div class="glass p-5 space-y-2">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <div>
          <b class="text-base">${esc(a.name)}</b> <span class="text-xs opacity-70">· Klasse ${esc(a.klass)} (${esc(a.email||'-')})</span>
        </div>
        <div class="flex items-center gap-2">${badge(a.status)}<span class="text-xs opacity-60">${fmt(a.createdAt)}</span></div>
      </div>
      <p class="text-sm opacity-85 bg-slate-500/10 p-3 rounded-xl">${esc(a.motivation)}</p>
      <div class="flex flex-wrap gap-2 pt-1">
        <button class="btn2 !text-emerald-500" onclick="acceptApplicant('${a.id}','${a.uid||''}')"><i data-lucide="check" class="w-4 h-4"></i>Annehmen (& zum Medienscout machen)</button>
        <button class="btn2 !text-amber-500" onclick="DB.upd('applications','${a.id}',{status:'Abgelehnt'})">Ablehnen</button>
        <button class="btn2 !text-rose-500 ml-auto" onclick="delItem('applications','${a.id}')">Löschen</button>
      </div>
    </div>`).join('')||'<div class="glass p-8 text-center opacity-60">Keine Bewerbungen vorhanden.</div>'}
  </div>`,

  team:()=>`<div class="grid md:grid-cols-5 gap-6">
    <div class="glass p-5 space-y-3 md:col-span-2 h-fit">
      <h3 class="font-bold">Neuen Account direkt anlegen</h3>
      <p class="text-xs opacity-70">Ihr könnt hier neue Accounts erstellen oder rechts bestehende Schul-Accounts per Klick zum <b>Admin</b> oder <b>Medienscout</b> ernennen.</p>
      <input id="u-name" class="inp" placeholder="Vor- und Nachname">
      <input id="u-mail" type="email" class="inp" placeholder="Schul-E-Mail-Adresse">
      <input id="u-pw" type="text" class="inp" placeholder="Start-Passwort (min. 6 Zeichen)">
      <select id="u-role" class="inp"><option>Schüler</option><option>Medienscout</option><option>Admin</option></select>
      <button class="btn w-full" onclick="addUser()"><i data-lucide="user-plus" class="w-4 h-4"></i>Account anlegen</button>
    </div>
    <div class="space-y-2 md:col-span-3">
      <h3 class="font-bold mb-2">Registrierte Accounts (${S.users.length})</h3>
      ${S.users.map(u=>`<div class="glass p-3.5 flex items-center justify-between gap-2 flex-wrap">
        <div>
          <div class="font-semibold text-sm">${esc(u.name)}</div>
          <div class="text-xs opacity-60">${esc(u.email)}</div>
        </div>
        <div class="flex items-center gap-2">
          <select class="inp !w-auto !py-1.5 !px-2.5 text-xs" onchange="DB.upd('users','${u.id}',{role:this.value});toast('Rolle geändert')">
            ${['Schüler','Medienscout','Admin'].map(r=>`<option ${u.role==r?'selected':''}>${r}</option>`).join('')}
          </select>
          ${u.id!=S.user.uid?`<button class="btn2 !text-rose-500" onclick="delItem('users','${u.id}')"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>`:''}
        </div>
      </div>`).join('')}
    </div>
  </div>`
};

window.acceptApplicant=async(appId,uid)=>{
  await DB.upd('applications',appId,{status:'Angenommen'});
  if(uid)await DB.upd('users',uid,{role:'Medienscout'}).catch(()=>{});
  toast('Bewerbung angenommen & Account als Medienscout freigeschaltet!');
};

window.delItem=async(c,id)=>{if(confirm('Diesen Eintrag wirklich löschen?'))await DB.del(c,id)};
window.saveVideo=async id=>{
  const vid=ytId(val('v-url'));if(!vid)return toast('Bitte gültigen YouTube-Link eingeben.');
  const d={vid,title:val('v-title'),cat:val('v-cat'),desc:val('v-desc'),published:true};
  if(!d.title)return toast('Titel fehlt.');
  id?await DB.upd('videos',id,d):await DB.add('videos',{...d,createdAt:Date.now()});
  S.edit=null;toast('Video gespeichert.');render();
};
window.saveArt=async id=>{
  const d={title:val('a-title'),cat:val('a-cat'),body:val('a-body'),published:val('a-pub')==='1'};
  if(!d.title||!d.body)return toast('Bitte Titel und Inhalt ausfüllen.');
  id?await DB.upd('articles',id,d):await DB.add('articles',{...d,createdAt:Date.now()});
  S.edit=null;toast('Artikel gespeichert.');render();
};
window.addUser=async()=>{
  const email=val('u-mail'),name=val('u-name'),pw=val('u-pw'),role=val('u-role');
  if(!email||!name||pw.length<6)return toast('Bitte alle Felder ausfüllen (Passwort min. 6 Zeichen).');
  try{
    const sec=initializeApp(firebaseConfig,'sec'+Date.now()),sa=getAuth(sec);
    const c=await createUserWithEmailAndPassword(sa,email,pw);
    await DB.set('users',c.user.uid,{email,name,role,createdAt:Date.now()});
    await signOut(sa);toast('Account wurde angelegt.');
    ['u-mail','u-name','u-pw'].forEach(i=>$('#'+i).value='');
  }catch(e){toast('Fehler: '+e.code)}
};

// ---------- Ersteinrichtung ----------
window.setup=async()=>{
  try{
    const email=val('l-mail'),pw=val('l-pw');
    const c=await createUserWithEmailAndPassword(auth,email,pw);
    await DB.set('users',c.user.uid,{email,name:'Haupt-Admin',role:'Admin',createdAt:Date.now()});
    await DB.set('settings','main',{...S.settings,setupDone:true});
    const now=Date.now();
    await DB.add('videos',{vid:'Y3SFXvtfZQQ',title:'Sicher im Netz – Grundlagen',cat:'Passwörter & Sicherheit',desc:'Wichtige Tipps für deine Privatsphäre und sichere Accounts.',published:true,createdAt:now});
    await DB.add('articles',{cat:'Schul-IT & Accounts',title:'Wie funktioniert dieses Hilfe-Portal?',body:"## Willkommen auf unserem Schulportal\nHier findest du Anleitungen und schnelle Hilfe bei Fragen rund um digitale Medien, Social Media und deine Schul-Accounts.\n\n- Lies dir unsere Anleitungen und Videos direkt ohne Anmeldung durch\n- Melde dich mit deiner Schul-E-Mail an, um ein persönliches Support-Ticket zu starten\n- Im Ticket kannst du direkt mit den Medienscouts chatten und Screenshots schicken",published:true,createdAt:now});
    closeModal();toast('Admin-Account & Startdaten erfolgreich eingerichtet!');
  }catch(e){toast('Fehler: '+e.code)}
};

Object.assign(window,{S,DB,val,render});
render();
</script>
</body>
</html>
