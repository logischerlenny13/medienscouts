<!DOCTYPE html>
<html lang="de" class="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schulportal · Digitale Hilfe & Medienscouts</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/lucide@0.383.0"></script>
<style type="text/tailwindcss">
.glass{@apply bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border border-slate-200/80 dark:border-slate-800 rounded-2xl shadow-sm}
.inp{@apply w-full rounded-xl px-3.5 py-2.5 bg-white dark:bg-slate-800/90 border border-slate-300 dark:border-slate-700 outline-none focus:ring-2 ring-blue-600 text-sm transition}
.btn{@apply inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold transition disabled:opacity-50 cursor-pointer shadow-sm}
.btn2{@apply inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl bg-slate-200/70 dark:bg-slate-800 hover:bg-slate-300/70 dark:hover:bg-slate-700 text-xs font-medium transition cursor-pointer}
.tab{@apply px-3.5 py-2 rounded-xl text-sm font-medium hover:bg-blue-500/10 transition cursor-pointer}
.tab.on{@apply bg-blue-600 text-white shadow-sm}
.prose p{margin:.85rem 0;line-height:1.75;font-size:1.02rem}.prose h3{font-weight:700;font-size:1.3rem;margin-top:1.6rem;margin-bottom:.5rem}.prose ul{list-style:disc;padding-left:1.5rem;margin:.8rem 0;line-height:1.7}
</style>
</head>
<body class="min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 bg-cover bg-center bg-fixed transition-colors">
<div id="bg-overlay" class="min-h-screen flex flex-col">
  <div id="app" class="flex-1 flex flex-col"></div>
</div>
<div id="modal"></div>
<div id="chat-fullscreen"></div>
<div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[120]"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyAheWnI7RFPl9h0C0rGy_6-l5liyNsMKzc",authDomain:"medienscoutswebseite.firebaseapp.com",projectId:"medienscoutswebseite",storageBucket:"medienscoutswebseite.firebasestorage.app",messagingSenderId:"731139325748",appId:"1:731139325748:web:a67d05e3ae067a4e266f61"};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);

// ---------- Datenschicht ----------
const DB={
  watch:(col,cb,order)=>onSnapshot(order?query(collection(db,col),orderBy(order,'desc')):collection(db,col),s=>cb(s.docs.map(d=>({id:d.id,...d.data()})))),
  watchMy:(col,uid,cb)=>onSnapshot(query(collection(db,col),where('uid','==',uid)),s=>cb(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt)))),
  add:(col,d)=>addDoc(collection(db,col),d),
  set:(col,id,d)=>setDoc(doc(db,col,id),d),
  upd:(col,id,d)=>updateDoc(doc(db,col,id),d),
  del:(col,id)=>deleteDoc(doc(db,col,id)),
  get:async(col,id)=>{const s=await getDoc(doc(db,col,id));return s.exists()?{id:s.id,...s.data()}:null},
  msgs:(id,cb)=>onSnapshot(query(collection(db,'tickets',id,'messages'),orderBy('ts')),s=>cb(s.docs.map(d=>({id:d.id,...d.data()})))),
  addMsg:(id,m)=>addDoc(collection(db,'tickets',id,'messages'),m),
  surveyResp:(sid,cb)=>onSnapshot(collection(db,'surveys',sid,'responses'),s=>cb(s.docs.map(d=>({id:d.id,...d.data()})))),
  addSurveyResp:(sid,d)=>addDoc(collection(db,'surveys',sid,'responses'),d)
};

const S={
  settings:{
    tickets:true,apps:true,allowReg:true,artFeedback:true,board:true,surveys:true,profileExtras:true,feedback:true,personalization:true,mediaLibrary:true,
    slashCommandsEnabled:true,passwordSupport:true,
    slashCommands:[{id:'passwort',name:'passwort',label:'Passwort wurde geändert',active:true,requiresPassword:true,roles:['Admin','Medienscout'],message:'Dein Passwort wurde geändert. Bitte nutze die folgende Anleitung, um dich mit deinem neuen Passwort anzumelden. Das Passwort erhältst du separat über einen geschützten Weg.',image:''}],
    schoolName:'Schulportal · Digitale Hilfe',subTitle:'Anleitungen, Artikel & direkter Support der Medienscouts',logo:'',bg:''
  },
  needSetup:false,videos:[],articles:[],boardItems:[],surveys:[],tickets:[],apps:[],myTickets:[],myApps:[],users:[],feedbackItems:[],
  user:null,view:'home',activeArtId:null,activeVideoId:null,libraryType:'',activeSurveyId:null,surveyStepClass:'',
  adminTab:'settings',authMode:'login',q:'',cat:'Alle',edit:null,open:null,
  chatNoteMode:false,surveyBuilderQs:[],surveyResults:[],activeResultSurvey:null,unsubs:[]
};

const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{$('#toast').innerHTML=`<div class="glass px-4 py-2.5 text-sm font-medium shadow-xl border-blue-500/40">${esc(t)}</div>`;setTimeout(()=>$('#toast').innerHTML='',3400)};
const icons=()=>lucide.createIcons();
const val=id=>$('#'+id)?.value.trim()||'';
const fmt=ts=>ts?new Date(ts).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}):'-';
const ytId=u=>{const m=String(u||'').match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:/^[\w-]{11}$/.test(u)?u:null};
const CATS=['Cybermobbing','Datenschutz','Passwörter & Sicherheit','Passwort zurücksetzen','Social Media','Schul-IT & Accounts','Sonstiges'];
const passwordPlatforms=()=>S.settings.passwordPlatforms||['Minecraft','Roblox','Instagram','TikTok','Sonstige'];
const CLASSES=['Alle','Klasse 5','Klasse 6','Klasse 7','Klasse 8','Klasse 9','Klasse 10','EF / Oberstufe'];

const compress=(f,max=1000,q=0.75)=>new Promise((res,rej)=>{
  const r=new FileReader();r.onerror=rej;
  r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};i.onerror=rej;i.src=r.result};
  r.readAsDataURL(f);
});

const fmtArticle=t=>String(t||'').split(/\n\s*\n/).map(b=>{
  const l=b.split('\n');
  if(l.every(x=>/^[-*] /.test(x)))return'<ul>'+l.map(x=>`<li>${esc(x.slice(2))}</li>`).join('')+'</ul>';
  if(/^## /.test(b))return`<h3>${esc(b.slice(3))}</h3>`;
  return`<p>${esc(b).replace(/\n/g,'<br>')}</p>`;
}).join('');

const isStaff=()=>S.user&&['Admin','Medienscout'].includes(S.user.role);
const sortPinned=arr=>[...arr].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(b.createdAt||0)-(a.createdAt||0));

// ---------- Live-Abos ----------
onSnapshot(doc(db,'settings','main'),s=>{
  S.needSetup=!s.exists()||!s.data().setupDone;
  if(s.exists())S.settings={...S.settings,...s.data()};
  applyDesign();render();
},()=>render());

DB.watch('videos',d=>{S.videos=d;render()},'createdAt');
DB.watch('articles',d=>{S.articles=d;render()},'createdAt');
DB.watch('board',d=>{S.boardItems=d;render()},'createdAt');
DB.watch('surveys',d=>{S.surveys=d;render()},'createdAt');

onAuthStateChanged(auth,async u=>{
  S.unsubs.forEach(f=>f());S.unsubs=[];
  if(!u){S.user=null;S.myTickets=[];S.myApps=[];if(!['home','article'].includes(S.view))S.view='home';render();return}
  let p=await DB.get('users',u.uid);
  if(!p){
    p={email:u.email,name:u.email.split('@')[0],klass:'',role:'Schüler',createdAt:Date.now()};
    await DB.set('users',u.uid,p);
  }
  S.user={uid:u.uid,...p};
  if(S.settings.personalization&&typeof p.preferences?.darkMode==='boolean')document.documentElement.classList.toggle('dark',p.preferences.darkMode);
  if(S.open=='login')closeModal();

  S.unsubs.push(DB.watchMy('tickets',u.uid,d=>{S.myTickets=d;render()}));
  S.unsubs.push(DB.watchMy('applications',u.uid,d=>{S.myApps=d;render()}));

  if(['Admin','Medienscout'].includes(p.role)){
    const w=(c,k,o)=>S.unsubs.push(DB.watch(c,d=>{S[k]=d;render()},o));
    w('tickets','tickets','updatedAt');
    w('applications','apps','createdAt');
    w('users','users');
    w('feedback','feedbackItems','createdAt');
  }
  render();
});

function applyDesign(){
  document.body.style.backgroundImage=S.settings.bg?`url(${S.settings.bg})`:'none';
  $('#bg-overlay').className=S.settings.bg?'min-h-screen flex flex-col bg-slate-100/85 dark:bg-slate-950/85 backdrop-blur-sm':'min-h-screen flex flex-col';
}

// ---------- Haupt-Rendering ----------
function render(){
  const ae=document.activeElement;
  if(ae&&ae.tagName!='BODY'&&ae.closest('#app')&&['INPUT','TEXTAREA','SELECT'].includes(ae.tagName)&&!ae.id.startsWith('s-'))return;
  let content='';
  if(S.view=='admin'&&isStaff())content=adminView();
  else if(S.view=='profile'&&S.user)content=profileView();
  else if(S.view=='tickets'&&S.user)content=studentTicketsView();
  else if(S.view=='apply'&&S.user)content=studentApplyView();
  else if(S.view=='surveys')content=surveysView();
  else if(S.view=='article')content=articlePageView();
  else if(S.view=='videos'||S.view=='articles')content=mediaLibraryView(S.view);
  else content=homeView();

  $('#app').innerHTML=nav()+`<main class="max-w-5xl w-full mx-auto px-4 py-8 flex-1">${content}</main>`+footer();
  icons();
}

const nav=()=>`<header class="sticky top-0 z-40 glass !rounded-none border-x-0 border-t-0">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-3">
    <button onclick="S.view='home';render()" class="font-bold text-base sm:text-lg flex items-center gap-2.5 text-left cursor-pointer">
      ${S.settings.logo?`<img src="${S.settings.logo}" class="h-8 w-8 rounded-lg object-contain bg-white/10">`:`<div class="w-8 h-8 rounded-lg bg-blue-600 text-white flex items-center justify-center"><i data-lucide="graduation-cap" class="w-5 h-5"></i></div>`}
      <div>
        <div class="leading-tight">${esc(S.settings.schoolName)}</div>
        <div class="text-[11px] font-normal opacity-60 hidden sm:block">Unterstützt durch die Medienscouts</div>
      </div>
    </button>

    <div class="ml-auto flex items-center gap-1.5 sm:gap-2">
      <button class="btn2 ${S.view=='home'||S.view=='article'?'!bg-blue-600 !text-white':''}" onclick="S.view='home';render()"><i data-lucide="book-open" class="w-4 h-4"></i><span class="hidden md:inline">Start & Wissen</span></button>
      ${S.settings.surveys?`<button class="btn2 ${S.view=='surveys'?'!bg-blue-600 !text-white':''}" onclick="S.view='surveys';S.activeSurveyId=null;render()"><i data-lucide="clipboard-list" class="w-4 h-4"></i><span class="hidden md:inline">Umfragen</span></button>`:''}
      ${S.settings.tickets?`<button class="btn2 ${S.view=='tickets'?'!bg-blue-600 !text-white':''}" onclick="goProtected('tickets')"><i data-lucide="message-square-text" class="w-4 h-4"></i><span class="hidden sm:inline">Tickets</span>${S.myTickets.some(t=>t.unreadStudent)?`<span class="w-2 h-2 rounded-full bg-rose-500"></span>`:''}</button>`:''}
      ${S.settings.apps?`<button class="btn2 ${S.view=='apply'?'!bg-blue-600 !text-white':''}" onclick="goProtected('apply')"><i data-lucide="user-plus" class="w-4 h-4"></i><span class="hidden lg:inline">Bewerbung</span></button>`:''}
      ${isStaff()?`<button class="btn2 ${S.view=='admin'?'!bg-blue-600 !text-white':''}" onclick="S.view='admin';render()"><i data-lucide="shield" class="w-4 h-4 text-blue-500 ${S.view=='admin'?'!text-white':''}"></i><span>Admin</span></button>`:''}
      ${S.settings.personalization?`<button class="btn2" onclick="document.documentElement.classList.toggle('dark')" title="Hell/Dunkel"><i data-lucide="sun-moon" class="w-4 h-4"></i></button>`:''}
      ${S.user?`<button class="btn2 !p-2.5 ${S.view=='profile'?'!bg-blue-600 !text-white':''}" onclick="S.view='profile';render()" title="Mein Profil" aria-label="Mein Profil"><i data-lucide="user-round" class="w-5 h-5"></i></button>`:`<button class="btn !py-2 !px-3.5" onclick="openAuth('login')"><i data-lucide="user" class="w-4 h-4"></i>Anmelden</button>`}
    </div>
  </div>
</header>`;

const footer=()=>`<footer class="text-center text-xs opacity-60 py-6 border-t border-slate-200/60 dark:border-slate-800/60 mt-12">${esc(S.settings.schoolName)} · Schulportal & Medienscouts</footer>`;

// ---------- Startseite (Schulportal, Schwarzes Brett, Artikel & Videos getrennt, Aktions-Boxen) ----------
function isFreshMedia(x){return !!x.createdAt&&Date.now()-x.createdAt<7*24*60*60*1000}
function mediaState(kind){const p=S.user?.mediaState||{};return {seen:p[kind+'Seen']||[],favorites:p[kind+'Favorites']||[]}}
function mediaIsSeen(kind,id){return mediaState(kind).seen.includes(id)}
function mediaIsFavorite(kind,id){return mediaState(kind).favorites.includes(id)}
window.updateMediaState=async(kind,id,key)=>{
  if(!S.user){openAuth('login');return toast('Bitte melde dich an, um Favoriten und Fortschritt zu speichern.')}
  const state={...(S.user.mediaState||{})},field=kind+(key==='seen'?'Seen':'Favorites'),arr=[...(state[field]||[])];
  state[field]=arr.includes(id)?arr.filter(x=>x!==id):[...arr,id];
  S.user.mediaState=state;
  await DB.upd('users',S.user.uid,{mediaState:state});
  render();
};
window.markMediaSeen=async(kind,id)=>{
  if(!S.user||mediaIsSeen(kind,id))return;
  const state={...(S.user.mediaState||{})},field=kind+'Seen';
  state[field]=[...(state[field]||[]),id];
  S.user.mediaState=state;
  await DB.upd('users',S.user.uid,{mediaState:state});
};
window.openVideo=id=>{
  const v=S.videos.find(x=>x.id===id);if(!v)return toast('Video nicht gefunden.');
  S.activeVideoId=id;markMediaSeen('videos',id);
  const related=S.videos.filter(x=>x.id!==id&&x.published!==false&&x.cat===v.cat).slice(0,3);
  modal(\`<div class="space-y-4">
    <div class="flex items-center justify-between gap-3"><span class="text-xs font-semibold uppercase tracking-wide text-rose-500">Video ansehen</span><button class="btn2 !p-2" onclick="closeModal()" aria-label="Schließen"><i data-lucide="x" class="w-4 h-4"></i></button></div>
    <div class="aspect-video bg-black rounded-xl overflow-hidden"><iframe class="w-full h-full" src="https://www.youtube-nocookie.com/embed/\${esc(v.vid)}?autoplay=1&rel=0" title="\${esc(v.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
    <div class="flex items-start justify-between gap-3"><div class="min-w-0"><h2 class="text-xl font-bold">\${esc(v.title)}</h2><div class="text-xs opacity-60 mt-1">\${esc(v.cat||'Video')} · \${fmt(v.createdAt)}</div></div><button class="btn2 shrink-0" onclick="updateMediaState('videos','\${v.id}','favorites')" title="Merken"><i data-lucide="bookmark" class="w-4 h-4 \${mediaIsFavorite('videos',v.id)?'text-amber-500':''}"></i></button></div>
    \${v.desc?'<div class="pt-3 border-t border-slate-200 dark:border-slate-700"><h3 class="font-semibold text-sm mb-1">Beschreibung</h3><p class="text-sm opacity-80 whitespace-pre-wrap leading-relaxed">'+esc(v.desc)+'</p></div>':''}
    <a class="btn2 w-full justify-center" href="https://www.youtube.com/watch?v=\${encodeURIComponent(v.vid)}" target="_blank" rel="noopener noreferrer"><i data-lucide="external-link" class="w-4 h-4"></i>Auf YouTube öffnen</a>
    \${related.length?'<div class="pt-3 border-t border-slate-200 dark:border-slate-700 space-y-2"><h3 class="font-semibold text-sm">Weitere Videos zum Thema</h3>'+related.map(x=>'<button class="block w-full text-left p-2 rounded-lg hover:bg-slate-500/10 text-sm" onclick="openVideo(\\''+x.id+'\\')">'+esc(x.title)+'</button>').join('')+'</div>':''}
  </div>\`);
  const panel=$('#modal .max-w-xl');if(panel)panel.classList.replace('max-w-xl','max-w-4xl');
};
function mediaCard(kind,x){
  const seen=mediaIsSeen(kind,x.id),favorite=mediaIsFavorite(kind,x.id),fresh=isFreshMedia(x);
  if(kind==='videos')return \`<article class="glass overflow-hidden group">
    <button class="block w-full text-left relative aspect-video bg-black" onclick="openVideo('\${x.id}')">
      <img src="https://img.youtube.com/vi/\${encodeURIComponent(x.vid)}/hqdefault.jpg" alt="" loading="lazy" class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition">
      <span class="absolute inset-0 flex items-center justify-center"><span class="w-14 h-14 rounded-full bg-black/65 text-white flex items-center justify-center"><i data-lucide="play" class="w-7 h-7 fill-current"></i></span></span>
      \${x.pinned?'<span class="absolute top-2 left-2 text-[11px] rounded-full bg-amber-500 text-white px-2 py-1"><i data-lucide="pin" class="w-3 h-3 inline"></i> Angepinnt</span>':''}
      \${fresh?'<span class="absolute top-2 right-2 text-[11px] rounded-full bg-emerald-600 text-white px-2 py-1">NEU</span>':''}
    </button>
    <div class="p-4 space-y-2"><div class="flex items-center justify-between gap-2"><span class="text-[11px] rounded-md bg-rose-500/10 text-rose-500 px-2 py-1">\${esc(x.cat||'Video')}</span><span class="text-[11px] opacity-60">\${seen?'Angesehen':'Noch nicht angesehen'}</span></div><h3 class="font-bold">\${esc(x.title)}</h3><p class="text-xs opacity-70 line-clamp-2">\${esc(x.desc||'')}</p><div class="flex items-center justify-between pt-1"><button class="text-sm font-semibold text-blue-600" onclick="openVideo('\${x.id}')">Video ansehen →</button><button class="btn2 !p-2" onclick="updateMediaState('videos','\${x.id}','favorites')" title="Merken"><i data-lucide="bookmark" class="w-4 h-4 \${favorite?'text-amber-500':''}"></i></button></div></div>
  </article>\`;
  const words=String(x.body||'').split(/\s+/).length,readMin=Math.max(1,Math.round(words/160));
  return \`<article class="glass p-5 flex flex-col gap-3">
    <div class="flex items-center gap-2 flex-wrap"><span class="text-[11px] rounded-md bg-blue-500/10 text-blue-600 px-2 py-1">\${esc(x.cat||'Artikel')}</span>\${x.pinned?'<span class="text-[11px] text-amber-500"><i data-lucide="pin" class="w-3 h-3 inline"></i> Angepinnt</span>':''}\${fresh?'<span class="text-[11px] text-emerald-600">NEU</span>':''}<span class="ml-auto text-[11px] opacity-60">\${readMin} Min.</span></div>
    <button class="text-left" onclick="openArtPage('\${x.id}')"><h3 class="font-bold text-lg">\${esc(x.title)}</h3><p class="text-sm opacity-70 mt-2 line-clamp-3">\${esc(String(x.body||'').replace(/## /g,'').slice(0,190))}…</p></button>
    <div class="flex items-center justify-between pt-2 border-t border-slate-200/60 dark:border-slate-800/60"><span class="text-[11px] opacity-60">\${seen?'Gelesen':'Noch nicht gelesen'}</span><div class="flex items-center gap-2"><button class="btn2 !p-2" onclick="updateMediaState('articles','\${x.id}','favorites')" title="Merken"><i data-lucide="bookmark" class="w-4 h-4 \${favorite?'text-amber-500':''}"></i></button><button class="text-sm font-semibold text-blue-600" onclick="openArtPage('\${x.id}')">Lesen →</button></div></div>
  </article>\`;
}
function homeView(){
  const allArts=S.articles.filter(a=>a.published!==false),allVids=S.videos.filter(v=>v.published!==false);
  const searching=!!S.q.trim()||S.cat!=='Alle';
  const arts=sortPinned((searching?allArts:allArts.filter(a=>a.pinned)).filter(a=>(S.cat==='Alle'||a.cat===S.cat)&&(a.title+' '+a.body).toLowerCase().includes(S.q.toLowerCase()))).slice(0,searching?50:4);
  const vids=sortPinned((searching?allVids:allVids.filter(v=>v.pinned)).filter(v=>(S.cat==='Alle'||(v.cat||'Sonstiges')===S.cat)&&(v.title+' '+v.desc).toLowerCase().includes(S.q.toLowerCase()))).slice(0,searching?50:4);
  if(S.settings.mediaLibrary===false)return '<div class="glass p-8 text-center"><h1 class="text-xl font-bold">Artikel und Videos sind gerade nicht verfügbar.</h1><p class="text-sm opacity-70 mt-2">Bitte versuche es später erneut.</p></div>';
  return \`<div class="space-y-8">
    <section class="glass p-6 sm:p-8 space-y-2"><div class="text-xs font-semibold uppercase tracking-wider text-blue-600">Informationen & Selbsthilfe</div><h1 class="text-2xl sm:text-3xl font-bold">\${esc(S.settings.schoolName)}</h1><p class="text-sm opacity-75">\${esc(S.settings.subTitle)}</p><div class="flex flex-wrap gap-2 pt-2">\${S.settings.tickets?'<button class="btn" onclick="goProtected(\\'tickets\\')"><i data-lucide="message-square-plus" class="w-4 h-4"></i>Hilfe-Ticket öffnen</button>':''}\${S.settings.surveys&&S.surveys.some(s=>s.active!==false)?'<button class="btn2" onclick="S.view=\\'surveys\\';render()">Aktuelle Umfragen</button>':''}</div></section>

  return `<div class="max-w-3xl mx-auto space-y-6">

      </header>

      <!-- Nr. 7: Aktivierbares Artikel-Feedback -->
      ${S.settings.artFeedback?`<div id="art-fb-box" class="mt-8 pt-6 border-t border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-slate-500/5 p-4 rounded-xl">

window.voteArt=async(id,up)=>{
  const a=S.articles.find(x=>x.id==id);if(!a)return;
  await DB.upd('articles',id,up?{up:(a.up||0)+1}:{down:(a.down||0)+1});
  const box=$('#art-fb-box');
  if(!box)return;
  if(up){
    box.innerHTML=`<div class="text-sm font-medium text-emerald-500 flex items-center gap-2"><i data-lucide="check-circle" class="w-4 h-4"></i>Danke für dein positives Feedback!</div>`;
  }else{
    box.innerHTML=`<div class="w-full flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
      <div class="text-sm">Schade, dass das Problem noch nicht gelöst ist. Schreib uns direkt ein Ticket dazu!</div>
      <button class="btn" onclick="goProtected('tickets')"><i data-lucide="message-square-plus" class="w-4 h-4"></i>Ticket zu „${esc(a.title.slice(0,25))}…“ öffnen</button>

  }
  icons();
};

window.submitSurvey=async sid=>{
  const sv=S.surveys.find(x=>x.id==sid);if(!sv)return;
  const selClass=val('sv-class')||'Klasse 8';
  const visibleQs=(sv.questions||[]).filter(q=>!q.targetClass||q.targetClass=='Alle'||q.targetClass==selClass);
  const answers={};
  for(const q of visibleQs){
    if(q.type=='choice'){
      const checked=document.querySelector(`input[name="svq_${q.id}"]:checked`);
      answers[q.id]=checked?checked.value:'';
    }else{
      answers[q.id]=val(`svq_txt_${q.id}`);
    }
  }
  await DB.addSurveyResp(sid,{
    klass:selClass,
    uid:sv.anonymous?null:(S.user?.uid||null),
    userName:sv.anonymous?'Anonym':(S.user?.name||'Schüler'),
    userEmail:sv.anonymous?'-':(S.user?.email||'-'),
    answers,
    ts:Date.now()
  });
  S.activeSurveyId=null;
  toast('Vielen Dank für deine Teilnahme!');
  render();
};

window.submitAuth=async()=>{
  const email=val('l-mail'),pw=val('l-pw'),name=val('l-name'),klass=val('l-class');
  if(!email)return toast('Bitte E-Mail-Adresse eingeben.');
  try{
    if(S.authMode=='reset'){
      await sendPasswordResetEmail(auth,email);
      toast('E-Mail zum Zurücksetzen wurde gesendet!');
      openAuth('login');
      return;
    }
    if(!pw)return toast('Bitte Passwort eingeben.');
    if(S.authMode=='reg'){
      if(!S.settings.allowReg)return toast('Selbst-Registrierung ist deaktiviert.');
      if(!name)return toast('Bitte gib deinen Namen an.');
      const c=await createUserWithEmailAndPassword(auth,email,pw);
      await DB.set('users',c.user.uid,{email,name,klass:klass||'Klasse 8',role:'Schüler',createdAt:Date.now()});
    }else{
      await signInWithEmailAndPassword(auth,email,pw);
    }
    closeModal();
    if(S.pendingView){S.view=S.pendingView;S.pendingView=null;render()}
  }catch(e){toast('Fehler: '+e.code)}
};

const defaultSlashCommands=()=>[{id:'passwort',name:'passwort',label:'Passwort wurde geändert',active:true,requiresPassword:true,roles:['Admin','Medienscout'],message:'Dein Passwort wurde geändert. Bitte nutze die folgende Anleitung, um dich mit deinem neuen Passwort anzumelden. Das Passwort erhältst du separat über einen geschützten Weg.',image:''}];

window.saveSlashCommand=async id=>{
  const name=val('sc-name').toLowerCase().replace(/[^a-z0-9_-]/g,'');if(!name)return toast('Bitte einen gültigen Befehlsnamen eingeben.');
  const list=[...(S.settings.slashCommands||defaultSlashCommands())];if(list.some(x=>x.name===name&&x.id!==id))return toast('Diesen Befehl gibt es bereits.');
  const roles=val('sc-roles')==='admin'?['Admin']:val('sc-roles')==='scout'?['Medienscout']:['Admin','Medienscout'];
  const c={id:id||'cmd-'+Date.now(),name,label:val('sc-label')||('/'+name),message:$('#sc-message').value,image:val('sc-image'),active:$('#sc-active').checked,requiresPassword:$('#sc-password').checked,roles};
  const exists=list.some(x=>x.id===id);
  const next=exists?list.map(x=>x.id===id?c:x):[...list,c];
  await DB.set('settings','main',{...S.settings,setupDone:true,slashCommands:next});closeModal();toast('Slash-Befehl gespeichert.');render();
};
window.deleteSlashCommand=async id=>{if(!confirm('Diesen Slash-Befehl wirklich löschen?'))return;await DB.set('settings','main',{...S.settings,setupDone:true,slashCommands:(S.settings.slashCommands||defaultSlashCommands()).filter(x=>x.id!==id)});toast('Befehl gelöscht.');render();};
window.runSlashCommand=async(ticketId,input)=>{
  if(!S.settings.slashCommandsEnabled)return toast('Slash-Befehle sind deaktiviert.');
  const raw=input.trim().split(/\s+/)[0],name=raw.slice(1).toLowerCase();
  const cmd=(S.settings.slashCommands||defaultSlashCommands()).find(x=>x.name===name&&x.active);if(!cmd)return toast('Unbekannter oder deaktivierter Befehl: '+raw);
  if(!(cmd.roles||['Admin','Medienscout']).includes(S.user.role))return toast('Du darfst diesen Befehl nicht verwenden.');
  if(name==='passwort'&&!S.settings.passwordSupport)return toast('Der Passwort-Support ist deaktiviert.');
  const ticket=await DB.get('tickets',ticketId);if(!ticket)return toast('Ticket nicht gefunden.');
  modal(`<div class="space-y-3"><h3 class="font-bold text-lg">${esc(cmd.label||('/'+name))}</h3><p class="text-xs opacity-70">Empfänger: ${esc(ticket.userName)} · ${esc(ticket.userEmail)}</p>
    ${cmd.requiresPassword?'<label class="block text-xs">Neues Passwort (wird nicht in Chat/Firebase gespeichert)<input id="sc-secret" type="password" autocomplete="new-password" class="inp mt-1" placeholder="Neues Passwort"></label>':''}
    <div class="rounded-xl bg-slate-500/10 p-3 text-sm whitespace-pre-wrap">${esc(cmd.message||'')}</div>${cmd.image?'<img src="'+esc(cmd.image)+'" class="rounded-xl max-h-48 object-contain">':''}
    ${cmd.requiresPassword?'<p class="text-xs text-amber-600 dark:text-amber-400">Das Passwort wird nur lokal kopiert. Die Nachricht informiert den Schüler, dass es separat über einen geschützten Weg mitgeteilt wird.</p>':''}
    <div class="flex gap-2"><button class="btn2 flex-1" onclick="closeModal()">Abbrechen</button><button class="btn flex-1" onclick="submitSlashCommand('${ticketId}','${esc(cmd.id)}')">${cmd.requiresPassword?'Passwort kopieren & Nachricht senden':'Nachricht senden'}</button></div></div>`);
};
window.submitSlashCommand=async(ticketId,cmdId)=>{
  const cmd=(S.settings.slashCommands||defaultSlashCommands()).find(x=>x.id===cmdId);if(!cmd)return toast('Befehl nicht gefunden.');
  if(cmd.requiresPassword){const secret=$('#sc-secret')?.value||'';if(!secret)return toast('Bitte das neue Passwort eingeben.');try{await navigator.clipboard.writeText(secret)}catch(e){return toast('Kopieren nicht möglich. Bitte Browser-Berechtigung prüfen.')}$('#sc-secret').value='';}
  const now=Date.now();await DB.addMsg(ticketId,{from:'scout',senderName:S.user.name+' (Scout)',text:cmd.message||'',img:cmd.image||null,internal:false,ts:now});
  await DB.upd('tickets',ticketId,{updatedAt:now,unreadStudent:true,unreadAdmin:false,status:'In Bearbeitung'});closeModal();toast(cmd.requiresPassword?'Nachricht gesendet. Passwort liegt nur in deiner Zwischenablage.':'Nachricht gesendet.');
};

};

// ---------- Umfrage-Funktionen & CSV-Export ----------
window.addBuilderQ=()=>{
  const text=val('sv-q-text'),type=val('sv-q-type'),targetClass=val('sv-q-class'),opts=val('sv-q-opts');
  if(!text)return toast('Bitte Fragetext eingeben.');
  const options=type=='choice'?(opts?opts.split(',').map(x=>x.trim()).filter(Boolean):['Ja','Nein']):[];
  S.surveyBuilderQs.push({id:'q'+Date.now(),text,type,targetClass,options});
  $('#sv-q-text').value='';$('#sv-q-opts').value='';render();
};

window.saveSurvey=async()=>{
  const title=val('sv-title'),desc=val('sv-desc'),anonymous=$('#sv-anon')?.checked??true;
  if(!title||!S.surveyBuilderQs.length)return toast('Bitte Titel und mindestens eine Frage hinzufügen.');
  await DB.add('surveys',{title,desc,anonymous,questions:S.surveyBuilderQs,active:true,createdAt:Date.now()});
  S.surveyBuilderQs=[];toast('Umfrage veröffentlicht!');render();
};

window.loadSurveyResults=sid=>{
  const sv=S.surveys.find(x=>x.id==sid);if(!sv)return;
  S.activeResultSurvey=sv;
  DB.surveyResp(sid,res=>{S.surveyResults=res;render()});
};

function renderSurveyEvaluation(){
  const sv=S.activeResultSurvey,res=S.surveyResults||[];
  return `<div class="glass p-5 space-y-4 border-2 border-blue-500/40">
    <div class="flex items-center justify-between flex-wrap gap-2">
      <div>
        <h4 class="font-bold text-lg">Auswertung: ${esc(sv.title)}</h4>
        <div class="text-xs opacity-70">${res.length} abgegebene Stimmen</div>
      </div>
      <button class="btn" onclick="exportSurveyCsv()"><i data-lucide="download" class="w-4 h-4"></i>Als Excel-CSV herunterladen</button>
    </div>

    <div class="space-y-4">
      ${(sv.questions||[]).map(q=>{
        const counts={};
        res.forEach(r=>{const a=r.answers?.[q.id];if(a)counts[a]=(counts[a]||0)+1});
        return `<div class="p-3.5 rounded-xl bg-slate-500/10 space-y-2">
          <div class="font-semibold text-sm">${esc(q.text)} <span class="text-xs opacity-60">(${esc(q.targetClass||'Alle')})</span></div>
          ${q.type=='choice'
            ? (q.options||[]).map(opt=>{
                const n=counts[opt]||0,pct=res.length?Math.round((n/res.length)*100):0;
                return `<div class="text-xs space-y-1">
                  <div class="flex justify-between"><span>${esc(opt)}</span><b>${n} (${pct}%)</b></div>
                  <div class="w-full h-2 rounded-full bg-slate-500/20 overflow-hidden"><div class="h-full bg-blue-600" style="width:${pct}%"></div></div>
                </div>`;
              }).join('')
            : `<div class="text-xs space-y-1 max-h-32 overflow-auto">${res.map(r=>r.answers?.[q.id]?`<div class="p-1.5 rounded bg-white/50 dark:bg-slate-800"><b>${esc(r.userName)} (${esc(r.klass)}):</b> ${esc(r.answers[q.id])}</div>`:'').join('')||'Keine Freitext-Antworten'}</div>`}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

window.exportSurveyCsv=()=>{
  const sv=S.activeResultSurvey,res=S.surveyResults||[];if(!sv)return;
  const qs=sv.questions||[];
  const header=['Zeitpunkt','Klasse','Teilnehmer','E-Mail',...qs.map(q=>q.text)];
  const rows=res.map(r=>[fmt(r.ts),r.klass||'-',r.userName||'Anonym',r.userEmail||'-',...qs.map(q=>r.answers?.[q.id]||'')]);
  const csv='\uFEFF'+[header,...rows].map(row=>row.map(cell=>`"${String(cell??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Umfrage_${sv.title.replace(/\W+/g,'_')}.csv`;a.click();
};

// ---------- Schwarzes Brett & CSV-Account-Import ----------
window.saveBoardItem=async()=>{
  const type=val('b-type'),title=val('b-title'),text=val('b-text');
  if(!title||!text)return toast('Bitte Titel und Text eingeben.');
  await DB.add('board',{type,title,text,createdAt:Date.now()});
  toast('Am Schwarzen Brett veröffentlicht.');render();
};

window.readCsvFile=inp=>{
  if(!inp.files[0])return;
  const r=new FileReader();
  r.onload=()=>{if($('#csv-input'))$('#csv-input').value=r.result};
  r.readAsText(inp.files[0]);
};

window.runCsvImport=async()=>{
  const raw=val('csv-input');if(!raw)return toast('Bitte CSV-Daten einfügen.');
  const lines=raw.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let ok=0;
  toast('Import läuft… bitte kurz warten.');
  const sec=initializeApp(firebaseConfig,'csv'+Date.now()),sa=getAuth(sec);
  for(const line of lines){
    const [name,email,pw,klass,role]=line.split(/[;,]/).map(x=>x?.trim());
    if(!name||!email||!pw||pw.length<6)continue;
    try{
      const c=await createUserWithEmailAndPassword(sa,email,pw);
      await DB.set('users',c.user.uid,{name,email,klass:klass||'Klasse 8',role:role||'Schüler',createdAt:Date.now()});
      await signOut(sa);ok++;
    }catch(e){}
  }
  toast(`${ok} Accounts erfolgreich importiert!`);
  if($('#csv-input'))$('#csv-input').value='';
};

// ---------- Standard Admin-Aktionen ----------
window.acceptApplicant=async(appId,uid)=>{
  await DB.upd('applications',appId,{status:'Angenommen'});
  if(uid)await DB.upd('users',uid,{role:'Medienscout'}).catch(()=>{});
  toast('Bewerbung angenommen & als Medienscout freigeschaltet!');
};
window.delItem=async(c,id)=>{if(confirm('Diesen Eintrag wirklich löschen?'))await DB.del(c,id)};
window.saveVideo=async id=>{
  const vid=ytId(val('v-url'));if(!vid)return toast('Ungültiger YouTube-Link.');
  const d={vid,title:val('v-title'),cat:val('v-cat'),desc:val('v-desc'),pinned:$('#v-pin')?.checked||false,published:true};
  if(!d.title)return toast('Titel fehlt.');
  id?await DB.upd('videos',id,d):await DB.add('videos',{...d,createdAt:Date.now()});
  S.edit=null;toast('Video gespeichert.');render();
};
window.saveArt=async id=>{
  const d={title:val('a-title'),cat:val('a-cat'),body:val('a-body'),pinned:$('#a-pin')?.checked||false,published:val('a-pub')==='1'};
  if(!d.title||!d.body)return toast('Bitte Titel und Inhalt ausfüllen.');
  id?await DB.upd('articles',id,d):await DB.add('articles',{...d,up:0,down:0,createdAt:Date.now()});
  S.edit=null;toast('Artikel gespeichert.');render();
};
window.addUser=async()=>{
  const email=val('u-mail'),name=val('u-name'),pw=val('u-pw'),klass=val('u-class'),role=val('u-role');
  if(!email||!name||pw.length<6)return toast('Bitte alle Felder korrekt ausfüllen.');
  try{
    const sec=initializeApp(firebaseConfig,'sec'+Date.now()),sa=getAuth(sec);
    const c=await createUserWithEmailAndPassword(sa,email,pw);
    await DB.set('users',c.user.uid,{email,name,klass,role,createdAt:Date.now()});
    await signOut(sa);toast('Account angelegt.');
    ['u-mail','u-name','u-pw'].forEach(i=>$('#'+i).value='');
  }catch(e){toast('Fehler: '+e.code)}
};

// ---------- Ersteinrichtung ----------
window.setup=async()=>{
  try{
    const email=val('l-mail'),pw=val('l-pw');
    const c=await createUserWithEmailAndPassword(auth,email,pw);
    await DB.set('users',c.user.uid,{email,name:'Haupt-Admin',klass:'Team',role:'Admin',createdAt:Date.now()});
    await DB.set('settings','main',{...S.settings,setupDone:true});
    const now=Date.now();
    await DB.add('articles',{cat:'Schul-IT & Accounts',title:'Willkommen auf dem neuen Hilfe-Portal unserer Schule',pinned:true,published:true,up:12,down:0,createdAt:now,body:"## Schnelle Hilfe von Schülern für Schüler\nAuf dieser Webseite findest du wichtige Anleitungen, Sicherheitstipps und Erklärvideos rund um dein digitales Schulleben.\n\n- Lies dir Artikel in Ruhe durch und gib uns unten kurzes Feedback\n- Öffne bei Problemen ein Ticket und chatte im Vollbildmodus mit uns\n- Nimm an aktuellen Umfragen für deine Jahrgangsstufe teil"});
    await DB.add('videos',{vid:'Y3SFXvtfZQQ',title:'Sicher im Netz – Die wichtigsten Grundlagen',cat:'Passwörter & Sicherheit',desc:'So schützt du deine Accounts vor fremdem Zugriff.',pinned:true,published:true,createdAt:now});
    await DB.add('board',{type:'AG-News & Termine',title:'Offene Medienscout-Sprechstunde',text:'Jeden Dienstag in der 1. großen Pause sind wir auch persönlich für euch da!',createdAt:now});
    closeModal();toast('Admin & Startdaten erfolgreich angelegt!');
  }catch(e){toast('Fehler: '+e.code)}
};

Object.assign(window,{S,DB,val,render});
render();
</script>
