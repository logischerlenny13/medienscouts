<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword,sendPasswordResetEmail,setPersistence,indexedDBLocalPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,where,Timestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyAheWnI7RFPl9h0C0rGy_6-l5liyNsMKzc",authDomain:"medienscoutswebseite.firebaseapp.com",projectId:"medienscoutswebseite",storageBucket:"medienscoutswebseite.firebasestorage.app",messagingSenderId:"731139325748",appId:"1:731139325748:web:a67d05e3ae067a4e266f61"};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);
// Dauerhaft angemeldet bleiben: Speicher fest auf "lokal" stellen und vom Browser als dauerhaft anfordern
setPersistence(auth,indexedDBLocalPersistence).catch(()=>setPersistence(auth,browserLocalPersistence)).catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);toast('Fehler: '+(e.reason?.code||e.reason?.message||e.reason))});

// ---------- Datenschicht ----------
const DB={
  watch:(col,cb,order)=>onSnapshot(order?query(collection(db,col),orderBy(order,'desc')):collection(db,col),s=>cb(s.docs.map(d=>({id:d.id,...d.data()})))),
  watchPrivate:(uid,cb)=>{let a=[],b=[];const emit=()=>cb([...new Map([...a,...b].map(x=>[x.id,x])).values()].sort((x,y)=>(y.createdAt||0)-(x.createdAt||0)));const u1=onSnapshot(query(collection(db,'privateMessages'),where('fromUid','==',uid)),s=>{a=s.docs.map(d=>({id:d.id,...d.data()}));emit()});const u2=onSnapshot(query(collection(db,'privateMessages'),where('toUid','==',uid)),s=>{b=s.docs.map(d=>({id:d.id,...d.data()}));emit()});return()=>{u1();u2()};},
  watchMy:(col,uid,cb)=>onSnapshot(query(collection(db,col),where('uid','==',uid)),s=>cb(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt)))),
  add:(col,d)=>addDoc(collection(db,col),d),
  set:(col,id,d)=>setDoc(doc(db,col,id),d),
  upd:(col,id,d)=>updateDoc(doc(db,col,id),d),
  del:(col,id)=>deleteDoc(doc(db,col,id)),
  get:async(col,id)=>{const s=await getDoc(doc(db,col,id));return s.exists()?{id:s.id,...s.data()}:null},
  passwordGet:async id=>{const s=await getDoc(doc(db,'ticketPasswords',id));return s.exists()?{id:s.id,...s.data()}:null},
  passwordSet:(id,d)=>setDoc(doc(db,'ticketPasswords',id),d),
  msgs:(id,cb)=>onSnapshot(query(collection(db,'tickets',id,'messages'),orderBy('ts')),s=>cb(s.docs.map(d=>({id:d.id,...d.data()})))),
  addMsg:(id,m)=>addDoc(collection(db,'tickets',id,'messages'),m),
  surveyResp:(sid,cb)=>onSnapshot(collection(db,'surveys',sid,'responses'),s=>cb(s.docs.map(d=>({id:d.id,...d.data()})))),
  addSurveyResp:(sid,d)=>addDoc(collection(db,'surveys',sid,'responses'),d)
};

const S={
  settings:{
    tickets:true,apps:true,allowReg:true,artFeedback:true,board:true,surveys:true,profileExtras:true,feedback:true,personalization:true,mediaLibrary:true,mediaFavorites:true,mediaProgress:true,mediaNewBadge:true,mediaRelated:true,
    activityOverview:true,privateMessages:true,helpCenter:true,privateMessagingPolicy:'all',
    slashCommandsEnabled:true,passwordSupport:true,
    slashCommands:[{id:'passwort',name:'passwort',label:'Passwort wurde geändert',active:true,requiresPassword:true,roles:['Admin'],message:'Dein Passwort wurde geändert. Bitte nutze die folgende Anleitung, um dich mit deinem neuen Passwort anzumelden. Das Passwort erhältst du separat über einen geschützten Weg.',image:''}],
    schoolName:'Schulportal · Digitale Hilfe',subTitle:'Anleitungen, Artikel & direkter Support der Medienscouts',logo:'',bg:''
  },
  needSetup:false,videos:[],articles:[],boardItems:[],surveys:[],tickets:[],apps:[],myTickets:[],myApps:[],users:[],pubUsers:[],feedbackItems:[],helpArticles:[],privateMessages:[],securityIPs:[],securityOverrides:[],securityBlockedAccounts:[],securityBlockedDevices:[],securitySetupRequired:false,securityLoading:false,securityAlertCount:0,
  user:null,view:'home',activeArtId:null,activeVideoId:null,libraryType:'',activeSurveyId:null,surveyStepClass:'',
  adminTab:'settings',authMode:'login',q:'',cat:'Alle',edit:null,open:null,pageViews:0,
  chatNoteMode:false,surveyBuilderQs:[],svDraft:null,surveyResults:[],activeResultSurvey:null,unsubs:[],unsubSurveyResp:null
};
let lastCountedView=null;

const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{$('#toast').innerHTML=`<div class="glass px-4 py-2.5 text-sm font-medium shadow-xl border-blue-500/40">${esc(t)}</div>`;setTimeout(()=>$('#toast').innerHTML='',3400)};
const icons=()=>lucide.createIcons();
const val=id=>$('#'+id)?.value.trim()||'';
const fmt=ts=>ts?new Date(ts).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}):'-';
const ytId=u=>{const m=String(u||'').match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:/^[\w-]{11}$/.test(u)?u:null};
const CATS=['Cybermobbing','Datenschutz','Passwörter & Sicherheit','Passwort zurücksetzen','Social Media','Schul-IT & Accounts','Sonstiges'];
const passwordPlatforms=()=>S.settings.passwordPlatforms||['Untis','Schulportal','Minecraft','Roblox','Sonstige'];
const CLASSES=['Alle','Klasse 5','Klasse 6','Klasse 7','Klasse 8','Klasse 9','Klasse 10','EF / Oberstufe'];

const compress=(f,max=1000,q=0.75)=>new Promise((res,rej)=>{
  const r=new FileReader();r.onerror=rej;
  r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};i.onerror=rej;i.src=r.result};
  r.readAsDataURL(f);
});

const fmtArticle=t=>String(t||'').split(/\n\s*\n/).map(b=>{
  const l=b.split('\n');
  if(l.every(x=>/^[-*] /.test(x)))return'<ul>'+l.map(x=>`<li>${esc(x.slice(2))}</li>`).join('')+'</ul>';
  if(/^## /.test(b))return`<h3>${esc(b.slice(3))}</h3>`;
  return`<p>${esc(b).replace(/\n/g,'<br>')}</p>`;
}).join('');

const isStaff=()=>S.user&&['Admin','Medienscout'].includes(S.user.role);
const sortPinned=arr=>[...arr].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(b.createdAt||0)-(a.createdAt||0));

// Support-Desk: nur ungelöste Tickets, die unbeansprucht oder von mir beansprucht sind; Passwort-Tickets nur für Admins
const deskTickets=()=>S.tickets.filter(t=>t.status!=='Gelöst'&&(S.user.role==='Admin'||!t.passwordReset)&&(!t.assignedUid||t.assignedUid===S.user.uid));
// Beansprucht-Bereich (nur Admins): ungelöste Tickets, die jemand anderes beansprucht hat
const claimedTickets=()=>S.tickets.filter(t=>t.status!=='Gelöst'&&t.assignedUid&&t.assignedUid!==S.user.uid);

// ---------- Live-Abos ----------
onSnapshot(doc(db,'settings','main'),s=>{
  S.needSetup=!s.exists()||!s.data().setupDone;
  if(s.exists())S.settings={...S.settings,...s.data()};
  applyDesign();render();
},()=>render());

DB.watch('videos',d=>{S.videos=d;render()},'createdAt');
DB.watch('articles',d=>{S.articles=d;render()},'createdAt');
DB.watch('board',d=>{S.boardItems=d;render()},'createdAt');
DB.watch('surveys',d=>{S.surveys=d;render()},'createdAt');

onAuthStateChanged(auth,async u=>{
  S.unsubs.forEach(f=>f());S.unsubs=[];
  if(!u){S.user=null;S.myTickets=[];S.myApps=[];if(!['home','article'].includes(S.view))S.view='home';
    try{const check=await fetch('/api/security-check?deviceId='+encodeURIComponent(getSecurityDeviceId()),{cache:'no-store'});const info=await check.json();if(!check.ok||info.blocked){showSecurityBlock(info.countryName,info.error);return}if(!securityBlockSticky)clearSecurityBlock()}catch(e){console.error('Sicherheitsprüfung nicht erreichbar:',e);showSecurityBlock('Unbekannt','Die Sicherheitsprüfung ist momentan nicht erreichbar. Bitte versuche es später erneut.');return}
    render();return}
  try{const token=await u.getIdToken();const check=await fetch('/api/security-check?deviceId='+encodeURIComponent(getSecurityDeviceId()),{headers:{Authorization:'Bearer '+token},cache:'no-store'});const info=await check.json();if(check.status===403&&info.blocked){showSecurityBlock(info.countryName,info.error||'Dieser Account oder Zugriff wurde gesperrt.');return}if(!check.ok){console.warn('Sicherheitsprüfung vorübergehend nicht verfügbar; Sitzung bleibt bestehen:',info);toast('Sicherheitsprüfung vorübergehend nicht erreichbar. Deine Sitzung bleibt bestehen.')}else if(!securityBlockSticky)clearSecurityBlock()}catch(e){console.error('Aktive Sitzung konnte nicht sicher geprüft werden:',e);toast('Sicherheitsprüfung vorübergehend nicht erreichbar. Deine Sitzung bleibt bestehen.');}
  let p=await DB.get('users',u.uid);
  if(!p){
    p={email:u.email,name:u.email.split('@')[0],klass:'',role:'Schüler',createdAt:Date.now()};
    await DB.set('users',u.uid,p);
  }
  S.user={uid:u.uid,...p};lastCountedView=null;
  if(S.settings.personalization&&typeof p.preferences?.darkMode==='boolean')document.documentElement.classList.toggle('dark',p.preferences.darkMode);
  if(S.open=='login')closeModal();

  S.unsubs.push(DB.watchMy('tickets',u.uid,d=>{S.myTickets=d;render()}));
  S.unsubs.push(DB.watchMy('applications',u.uid,d=>{S.myApps=d;render()}));

  S.unsubs.push(DB.watchPrivate(u.uid,d=>{S.privateMessages=d;render()}));
  S.unsubs.push(DB.watch('publicUsers',d=>{S.pubUsers=d;render()}));
  await DB.set('publicUsers',u.uid,{name:S.user.name,role:S.user.role||'Schüler',klass:S.user.klass||''});
  S.unsubs.push(DB.watch('helpArticles',d=>{S.helpArticles=d;render()},'createdAt'));

  if(['Admin','Medienscout'].includes(p.role)){
    const w=(c,k,o)=>S.unsubs.push(DB.watch(c,d=>{S[k]=d;render()},o));
    w('tickets','tickets','updatedAt');
    if(p.role==='Admin')S.unsubs.push(DB.watch('pageViews',d=>{S.pageViews=d.length;render()}));
    w('applications','apps','createdAt');
    w('users','users');
    w('feedback','feedbackItems','createdAt');
    if(p.role==='Admin')loadSecurityIPs();
  }
  render();
});

function applyDesign(){
  document.body.style.backgroundImage=S.settings.bg?`url(${S.settings.bg})`:'';
  $('#bg-overlay').className=S.settings.bg?'min-h-screen flex flex-col bg-slate-100/85 dark:bg-slate-950/85 backdrop-blur-sm':'min-h-screen flex flex-col';
}

// ---------- Haupt-Rendering ----------
document.addEventListener('click',e=>{
  // iPad/iPhone: Eingabefeld behält sonst den Fokus und blockiert das Neuzeichnen -> Tasten wirken "tot"
  const b=e.target.closest('#app button,#app [onclick]'),a=document.activeElement;
  if(b&&a&&a!==b&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName)&&!(a.id||'').startsWith('s-')&&a.closest('#app'))a.blur();
},true);
function render(force=false){
  try{renderInner(force)}catch(err){console.error('Anzeigefehler:',err);toast('Anzeigefehler: '+(err.message||err))}
}
function renderInner(force=false){
  const ae=document.activeElement;
  if(!force&&ae&&ae.tagName!='BODY'&&ae.closest('#app')&&['INPUT','TEXTAREA','SELECT'].includes(ae.tagName)&&!ae.id.startsWith('s-'))return;
  const fid=ae&&ae.id&&ae.id.startsWith('s-')&&ae.closest('#app')?ae.id:null,pos=fid?ae.selectionStart:0;
  let content='';
  if(S.view=='admin'&&isStaff())content=adminView();
  else if(S.view=='profile'&&S.user)content=profileView();
  else if(S.view=='tickets'&&S.user)content=studentTicketsView();
  else if(S.view=='apply'&&S.user)content=studentApplyView();
  else if(S.view=='pwreset'&&S.user)content=pwResetView();
  else if(S.view=='surveys')content=surveysView();
  else if(S.view=='activity'&&S.settings.activityOverview!==false)content=activityOverviewView();
  else if(S.view=='privateMessages'&&S.user&&S.settings.privateMessages!==false)content=privateMessagesView();
  else if(S.view=='help'&&S.settings.helpCenter!==false)content=helpCenterView();
  else if(S.view=='article')content=articlePageView();
  else if(S.view=='videos'||S.view=='articles')content=mediaLibraryView(S.view);
  else content=homeView();

  $('#app').innerHTML=nav()+`<main class="w-full px-3 py-4 flex-1">${content}</main>`+footer();
  if(S.user&&lastCountedView!==S.view){lastCountedView=S.view;DB.add('pageViews',{ts:Date.now()}).catch(e=>console.warn('Seitenaufruf konnte nicht gezählt werden',e));}
  icons();
  if(fid){const e=$('#'+fid);if(e){e.focus();try{e.setSelectionRange(pos,pos)}catch(_){}}}
}

const ic=(n,c='w-7 h-7')=>`<img src="${IC[n]}" class="${c} select-none pointer-events-none" alt="">`;
(()=>{const s=document.createElement('style');s.textContent=`
body{background-image:linear-gradient(180deg,#05697a 0%,#497538 100%);background-attachment:fixed}
html.dark .glass{background:rgba(0,0,0,.22);border:0;backdrop-filter:none}
.tile{background:rgba(0,0,0,.22);border-radius:1.1rem;padding:.4rem;display:flex;align-items:center;gap:.35rem}
.ib{width:3.3rem;height:3.3rem;flex:none;border-radius:.9rem;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);cursor:pointer;position:relative;transition:.15s}
.ib:hover{background:rgba(255,255,255,.16)}.ib.on{background:rgba(255,255,255,.28)}
.ib img{width:1.75rem;height:1.75rem}.ib .dot{position:absolute;top:.35rem;right:.35rem;width:.6rem;height:.6rem;border-radius:9999px;background:#f43f5e}
.panel{background:rgba(0,0,0,.2);border-radius:1.25rem;padding:1.25rem;color:#fff}
.card2{background:rgba(0,0,0,.25);border-radius:1rem;padding:1.1rem;position:relative;color:#fff;text-align:center}
.ptitle{display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:2.1rem;font-weight:700;cursor:pointer;margin-bottom:1rem}
.wl{color:#4a90e2;font-size:1.25rem;font-weight:600;display:inline-flex;align-items:center;gap:.4rem;cursor:pointer}
.chip{background:rgba(0,0,0,.25);border-radius:.9rem;padding:.6rem 1rem;font-weight:600;cursor:pointer}.chip:hover{background:rgba(255,255,255,.16)}
.playbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:4.5rem;height:4.5rem;border-radius:1.2rem;background:rgba(120,110,90,.85);display:flex;align-items:center;justify-content:center}
.playbtn img{width:2rem;height:2rem}
`;document.head.appendChild(s)})();

const doSearch=v=>{S.q=v;if(!['home','articles','videos'].includes(S.view))S.view='home';render()};
window.doSearch=doSearch;window.ic=ic;
const toggleTheme=()=>S.user?togglePersonalTheme():(document.documentElement.classList.toggle('dark'),render());
window.toggleTheme=toggleTheme;

const nav=()=>{
  const v=S.view,on=(...a)=>a.includes(v)?'on':'',dark=document.documentElement.classList.contains('dark');
  const b=(ico,view,title,extra='')=>`<button class="ib ${on(view)}" title="${title}" aria-label="${title}" onclick="${extra||`S.view='${view}';S.q='';S.cat='Alle';render()`}">${ic(ico)}</button>`;
  const prot=(ico,view,title,flag)=>flag?`<button class="ib ${on(view)}" title="${title}" aria-label="${title}" onclick="goProtected('${view}')">${ic(ico)}${view==='tickets'&&S.myTickets.some(t=>t.unreadStudent)?'<span class="dot"></span>':''}</button>`:'';
  const logo=S.settings.logo?`<img src="${S.settings.logo}" style="width:2.4rem;height:2.4rem;object-fit:contain;border-radius:.5rem" alt="Home">`:`<img src="${IC.logo}" style="width:2.4rem;height:2.4rem" alt="Home">`;
  return `<header class="sticky top-0 z-40 px-3 pt-3 pb-1"><div class="flex items-center justify-between gap-2">
    <div class="tile"><button class="ib !bg-transparent" title="Startseite" aria-label="Startseite" onclick="S.view='home';S.q='';S.cat='Alle';render()">${logo}</button></div>
    <div class="tile overflow-x-auto max-w-[60vw]">
      ${b('book','articles','Anleitungen')}${b('video','videos','Videos')}
      ${prot('ticket','tickets','Tickets',S.settings.tickets)}${prot('key','pwreset','Passwort zurücksetzen',S.settings.passwordSupport)}${prot('userplus','apply','Bewerbung',S.settings.apps)}
    </div>
    <div class="flex items-center gap-2">
      <div class="tile">
        ${isStaff()?`<button class="ib ${on('admin')}" title="Admin" aria-label="Admin" onclick="S.view='admin';render()">${ic('shield')}</button>`:''}
        ${S.settings.personalization?`<button class="ib" title="Hell/Dunkel" onclick="toggleTheme()">${ic(dark?'sun':'moon')}</button>`:''}
        ${S.user?`<button class="ib ${on('profile')}" title="Mein Profil" aria-label="Mein Profil" onclick="S.view='profile';render()">${ic('account')}</button>`:`<button class="ib" title="Anmelden" aria-label="Anmelden" onclick="openAuth('login')">${ic('account')}</button>`}
      </div>
      <label class="tile !px-3 gap-2 cursor-text">${ic('search','w-7 h-7')}<input id="s-q" class="bg-transparent outline-none w-20 sm:w-40 text-white placeholder-white/70 text-lg" placeholder="Suchen ..." value="${esc(S.q)}" oninput="doSearch(this.value)"></label>
    </div></div></header>`;
};

function mediaCard(kind,x){
  const fav=mediaIsFavorite(kind,x.id),fresh=S.settings.mediaNewBadge!==false&&isFreshMedia(x),seen=mediaIsSeen(kind,x.id);
  const top=`${x.pinned?`<span class="absolute top-4 left-4">${ic('pin','w-6 h-6')}</span>`:''}
    ${S.settings.mediaFavorites!==false?`<button class="absolute top-3 right-3 opacity-80 hover:opacity-100 text-xl" onclick="updateMediaState('${kind}','${x.id}','favorites')" title="Merken">${fav?'★':'☆'}</button>`:''}`;
  if(kind==='videos')return `<article class="card2 space-y-3">${top}
    <h3 class="text-2xl font-bold px-8">${esc(x.title)}${fresh?' <span class="text-xs align-middle bg-emerald-600 rounded-full px-2 py-0.5">NEU</span>':''}</h3>
    <button class="relative block w-full aspect-video rounded-xl overflow-hidden bg-black" onclick="openVideo('${x.id}')"><img src="https://img.youtube.com/vi/${encodeURIComponent(x.vid)}/hqdefault.jpg" loading="lazy" class="w-full h-full object-cover" alt=""><span class="playbtn">${ic('play')}</span></button>
    ${S.settings.mediaProgress!==false?`<div class="text-xs opacity-60">${seen?'Angesehen':'Noch nicht angesehen'}</div>`:''}</article>`;
  const txt=String(x.body||'').replace(/^## /gm,'').replace(/^[-*] /gm,'').replace(/\s+/g,' ').slice(0,170);
  return `<article class="card2 flex flex-col gap-3">${top}
    <h3 class="text-2xl font-bold px-8">${esc(x.title)}${fresh?' <span class="text-xs align-middle bg-emerald-600 rounded-full px-2 py-0.5">NEU</span>':''}</h3>
    <p class="opacity-85 text-lg leading-snug">${esc(txt)} …</p>
    <div><button class="wl" onclick="openArtPage('${x.id}')">weiterlesen ${ic('chevblue','w-5 h-5')}</button></div>
    ${S.settings.mediaProgress!==false?`<div class="text-xs opacity-60">${seen?'Gelesen':'Noch nicht gelesen'}</div>`:''}</article>`;
}

function homeView(){
  if(S.settings.mediaLibrary===false)return '<div class="panel text-center"><h1 class="text-xl font-bold">Artikel und Videos sind gerade nicht verfügbar.</h1></div>';
  const q=S.q.toLowerCase(),searching=!!S.q.trim()||S.cat!=='Alle';
  const A=S.articles.filter(a=>a.published!==false),V=S.videos.filter(v=>v.published!==false);
  const arts=sortPinned((searching?A:A.filter(a=>a.pinned)).filter(a=>(S.cat==='Alle'||a.cat===S.cat)&&(a.title+' '+a.body).toLowerCase().includes(q))).slice(0,searching?50:4);
  const vids=sortPinned((searching?V:V.filter(v=>v.pinned)).filter(v=>(S.cat==='Alle'||(v.cat||'Sonstiges')===S.cat)&&((v.title||'')+' '+(v.desc||'')).toLowerCase().includes(q))).slice(0,searching?50:4);
  const head=(t,view)=>`<h2 class="ptitle" onclick="S.view='${view}';S.q='';S.cat='Alle';render()">${t} ${ic('chev','w-6 h-6')}</h2>`;
  const empty=t=>`<div class="card2 opacity-70 md:col-span-2">${t}</div>`;
  const more=[['surveys','Umfragen','surveys'],['activityOverview','Aktivität','activity'],['helpCenter','Hilfe-Center','help'],['privateMessages','Nachrichten','privateMessages']].filter(([k])=>S.settings[k]).map(([k,l,v])=>`<button class="chip" onclick="${v==='surveys'?"S.activeSurveyId=null;":''}${v==='privateMessages'&&!S.user?"openAuth('login')":`S.view='${v}';render()`}">${l}</button>`).join('');
  return `<div class="space-y-4 max-w-[1800px] mx-auto">
    ${S.settings.board&&S.boardItems.length&&!searching?`<section class="panel"><h2 class="ptitle !cursor-default">Aktuelles</h2><div class="grid md:grid-cols-2 gap-4">${S.boardItems.slice(0,4).map(b=>`<div class="card2"><div class="text-xs opacity-60">${esc(b.type)} · ${fmt(b.createdAt)}</div><b class="text-lg">${esc(b.title)}</b><p class="opacity-80 mt-1">${esc(b.text)}</p>${b.img?`<img src="${b.img}" onclick="zoom(this.src)" class="mt-2 rounded-lg max-h-56 mx-auto cursor-zoom-in" alt="">`:''}</div>`).join('')}</div></section>`:''}
    <section class="panel">${head('Anleitungen','articles')}<div class="grid md:grid-cols-2 gap-4">${arts.map(a=>mediaCard('articles',a)).join('')||empty(searching?'Keine passenden Anleitungen gefunden.':'Noch keine angepinnten Anleitungen.')}</div></section>
    <section class="panel">${head('Erklärvideos','videos')}<div class="grid md:grid-cols-2 gap-4">${vids.map(v=>mediaCard('videos',v)).join('')||empty(searching?'Keine passenden Videos gefunden.':'Noch keine angepinnten Videos.')}</div></section>
    ${more&&!searching?`<section class="panel flex flex-wrap justify-center gap-3">${more}</section>`:''}
  </div>`;
}

function mediaLibraryView(kind){
  if(S.settings.mediaLibrary===false)return '<div class="panel text-center">Dieser Bereich ist aktuell deaktiviert.</div>';
  const isV=kind==='videos',q=S.q.toLowerCase();

function isFreshMedia(x){return !!x.createdAt&&Date.now()-x.createdAt<7*24*60*60*1000}
function mediaState(kind){const p=S.user?.mediaState||{};return {seen:p[kind+'Seen']||[],favorites:p[kind+'Favorites']||[]}}
function mediaIsSeen(kind,id){return mediaState(kind).seen.includes(id)}
function mediaIsFavorite(kind,id){return mediaState(kind).favorites.includes(id)}
window.updateMediaState=async(kind,id,key)=>{
  if(!S.user){openAuth('login');return toast('Bitte melde dich an, um Favoriten und Fortschritt zu speichern.')}
  const state={...(S.user.mediaState||{})},field=kind+(key==='seen'?'Seen':'Favorites'),arr=[...(state[field]||[])];
  state[field]=arr.includes(id)?arr.filter(x=>x!==id):[...arr,id];
  S.user.mediaState=state;
  await DB.upd('users',S.user.uid,{mediaState:state});
  render();
};
window.markMediaSeen=async(kind,id)=>{
  if(S.settings.mediaProgress===false||!S.user||mediaIsSeen(kind,id))return;
  const state={...(S.user.mediaState||{})},field=kind+'Seen';
  state[field]=[...(state[field]||[]),id];
  S.user.mediaState=state;
  await DB.upd('users',S.user.uid,{mediaState:state});
  render();
};

window.submitSurvey=async sid=>{
  const sv=S.surveys.find(x=>x.id==sid);if(!sv)return;
  const selClass=val('sv-class')||'Klasse 8';
  const visibleQs=(sv.questions||[]).filter(q=>!q.targetClass||q.targetClass=='Alle'||q.targetClass==selClass);
  const answers={};
  for(const q of visibleQs){
    if(q.type=='choice'){
      const checked=document.querySelector(`input[name="svq_${q.id}"]:checked`);
      answers[q.id]=checked?checked.value:'';
    }else{
      answers[q.id]=val(`svq_txt_${q.id}`);
    }
  }
  try{
    await DB.addSurveyResp(sid,{
      klass:selClass,
      uid:sv.anonymous?null:(S.user?.uid||null),
      userName:sv.anonymous?'Anonym':(S.user?.name||'Schüler'),
      userEmail:sv.anonymous?'-':(S.user?.email||'-'),
      answers,
      ts:Date.now()
    });
  }catch(e){return toast('Fehler beim Absenden: '+(e.code||e.message))}
  S.activeSurveyId=null;
  toast('Vielen Dank für deine Teilnahme!');
  render();
};

let securityBlockSticky=false;
function showSecurityBlock(countryName,message){
  securityBlockSticky=true;
  let box=document.getElementById('security-block-screen');
  if(!box){box=document.createElement('div');box.id='security-block-screen';box.className='fixed inset-0 z-[9999] flex items-center justify-center p-5 bg-slate-950/95';document.body.appendChild(box)}
  const country=countryName||'Unbekannt';
  box.innerHTML=`<div class="w-full max-w-md rounded-3xl border border-rose-400/40 bg-slate-900 p-7 text-center text-white shadow-2xl">
    <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-rose-500/15 text-rose-400 text-3xl">⛔</div>
    <h1 class="text-2xl font-bold mb-3">Zugriff gesperrt</h1>
    <p class="text-sm leading-6 text-slate-200">${message||('Wir haben einen ungewöhnlichen Zugriff aus '+country+' erkannt. Der Zugriff auf diese Webseite wurde aus Sicherheitsgründen blockiert.')}</p>
    <p class="mt-5 text-xs text-slate-400">Erkannter Standort: <b class="text-rose-300">${esc(country)}</b></p>
    <p class="mt-5 text-xs text-slate-400">Wenn du glaubst, dass dies ein Fehler ist, wende dich bitte an die Schule.</p>
  </div>`;
  const app=document.getElementById('app');if(app)app.style.display='none';
}
function clearSecurityBlock(){
  if(securityBlockSticky)return;
  document.getElementById('security-block-screen')?.remove();
  const app=document.getElementById('app');if(app)app.style.display='';
}

function getSecurityDeviceId(){
  const key='medienscouts_security_device';
  let id=localStorage.getItem(key);
  if(!id){id=(crypto.randomUUID?crypto.randomUUID():('dev-'+Date.now()+'-'+Math.random().toString(36).slice(2)));localStorage.setItem(key,id);}
  return id;
}
window.submitAuth=async()=>{
  const email=val('l-mail'),pw=val('l-pw'),name=val('l-name'),klass=val('l-class');
  if(!email)return toast('Bitte E-Mail-Adresse eingeben.');
  try{
    let securityPreflight=null;
    if(S.authMode==='login'||S.authMode==='reg'){
      const deviceId=getSecurityDeviceId();const check=await fetch('/api/security-check?deviceId='+encodeURIComponent(deviceId),{method:'GET',cache:'no-store'});
      securityPreflight=await check.json();
      if(check.status===403&&securityPreflight.blocked){showSecurityBlock(securityPreflight.countryName,securityPreflight.error);return;}
      if(!check.ok){toast(securityPreflight.error||'Sicherheitsprüfung gerade nicht verfügbar. Bitte später erneut versuchen.');return;}
    }
    if(S.authMode=='reset'){
      await sendPasswordResetEmail(auth,email);
      toast('E-Mail zum Zurücksetzen wurde gesendet!');
      openAuth('login');
      return;
    }
    if(!pw)return toast('Bitte Passwort eingeben.');
    if(S.authMode=='reg'){
      if(!S.settings.allowReg)return toast('Selbst-Registrierung ist deaktiviert.');
      if(!name)return toast('Bitte gib deinen Namen an.');
      const c=await createUserWithEmailAndPassword(auth,email,pw);
      await DB.set('users',c.user.uid,{email,name,klass:klass||'Klasse 8',role:'Schüler',createdAt:Date.now()});
    }else{
      await signInWithEmailAndPassword(auth,email,pw);
    }
    if((S.authMode==='login'||S.authMode==='reg')&&auth.currentUser){
      try{
        const token=await auth.currentUser.getIdToken();
        const logged=await fetch('/api/security-check',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({eventType:'login',deviceId:getSecurityDeviceId()})});
        if(!logged.ok){const denial=await logged.json().catch(()=>({}));await signOut(auth);if(logged.status===403&&denial.blocked){showSecurityBlock(denial.countryName,denial.error)}else{toast(denial.error||'Anmeldung wurde durch die Sicherheitsprüfung nicht freigegeben.')}return;}
      }catch(logError){console.error('Sicherheitsprotokoll nicht erreichbar:',logError);await signOut(auth);toast('Anmeldung nicht freigegeben: Die Sicherheitsprüfung ist momentan nicht erreichbar. Bitte später erneut versuchen.');return;}
    }
    closeModal();
    if(S.pendingView){S.view=S.pendingView;S.pendingView=null;render()}
  }catch(e){toast('Fehler: '+e.code)}
};
window.logout=()=>{closeModal();closeChat();signOut(auth)};

        <div class="max-w-[80%] sm:max-w-[70%] px-4 py-3 rounded-2xl text-sm shadow-xs ${m.senderRole==='Admin'?'bg-rose-600 text-white':m.senderRole==='Medienscout'?'bg-amber-400 text-slate-950':m.senderRole==='User'?'bg-emerald-600 text-white':m.from==mySide?'bg-blue-600 text-white':'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700'}">
          <div class="text-[11px] opacity-75 mb-1 font-medium">${esc(m.senderName||(m.from=='scout'?'Medienscout':'Schüler'))} · ${fmt(m.ts)}</div>

window.revealTicketPassword=async id=>{
  if(!confirm('Bitte prüfe, dass gerade niemand auf deinen Bildschirm schaut. Passwort jetzt einblenden?'))return;
  const d=await DB.passwordGet(id).catch(()=>null);
  if(!d||d.uid!==S.user?.uid||d.expiresAt?.toMillis?.()<=Date.now())return toast('Die Zugangsdaten sind nicht mehr verfügbar.');
  const e=$('#pw-value-'+id);if(e)e.textContent=d.password;

window.copyTicketPassword=async id=>{
  const d=await DB.passwordGet(id).catch(()=>null);

window.claimTicket=async id=>{
  const ticket=S.tickets.find(t=>t.id===id)||await DB.get('tickets',id);
  if(!ticket)return toast('Ticket nicht gefunden.');
  if(ticket.status==='Gelöst')return toast('Gelöste Tickets können nicht übernommen werden.');
  if(!isStaff())return toast('Keine Berechtigung.');
  if(ticket.passwordReset&&S.user.role!=='Admin')return toast('Passwort-Tickets dürfen nur Admins übernehmen.');
  if(ticket.assignedUid&&ticket.assignedUid!==S.user.uid&&S.user.role!=='Admin')return toast('Dieses Ticket wurde schon übernommen.');
  await DB.upd('tickets',id,{assignedUid:S.user.uid,assignedName:S.user.name,status:'In Bearbeitung',updatedAt:Date.now()});
  if($('#c-assign'))$('#c-assign').textContent='Betreuer: '+S.user.name;
  if($('#c-st'))$('#c-st').innerHTML=badge('In Bearbeitung');
  toast('Du hast das Ticket übernommen.');
};

window.updStatus=async(id,st)=>{
  const t=await DB.get('tickets',id);if(!t)return;
  if(t.passwordReset&&S.user?.role!=='Admin')return toast('Nur Admins dürfen den Status von Passwort-Tickets ändern.');
  await DB.upd('tickets',id,{status:st,updatedAt:Date.now(),...(st==='Gelöst'?{resolvedAt:Date.now(),unreadStudent:true,...(t.passwordReset?{assignedUid:null,assignedName:null}:{})}:{})});
  if(st==='Gelöst'){closeChat();toast('Ticket gelöst. Es ist jetzt nur noch für den Schüler sichtbar.')}
  else if($('#c-st'))$('#c-st').innerHTML=badge(st);
};

// Schüler öffnet ein gelöstes Ticket wieder (mit Warnhinweis)
window.reopenTicket=async id=>{
  const t=await DB.get('tickets',id);if(!t||t.uid!==S.user?.uid)return;
  if(!confirm('Achtung: Der bisherige Chat, den bisher nur Admins und zuständige Medienscouts sehen konnten, wird jetzt für alle Medienscouts sichtbar, damit sie wissen, worum es geht. Passwörter bleiben verdeckt und sind nur für dich sichtbar.\n\nDas Ticket kann dann von allen berechtigten Personen gesehen werden, bis es wieder von jemandem übernommen wird.\n\nEinverstanden?'))return;
  await DB.upd('tickets',id,{passwordReset:false,status:'Neu',assignedUid:null,assignedName:null,updatedAt:Date.now(),unreadAdmin:true,unreadStudent:false,reopened:true});

window.sendMsg=async(id,asAdmin)=>{
  const currentTicket=await DB.get('tickets',id);if(!currentTicket)return toast('Ticket nicht gefunden.');
  if(currentTicket.status==='Gelöst')return toast('Dieses Ticket ist gelöst.');
  const text=val('s-c-msg'),img=pendingImg['c-prev']||null;if(!text&&!img)return;
  if(asAdmin&&!S.chatNoteMode&&text.startsWith('/')){$('#s-c-msg').value='';await runSlashCommand(id,text);return;}
  const now=Date.now(),isInternal=asAdmin&&S.chatNoteMode;
  await DB.addMsg(id,{from:asAdmin?'scout':'student',senderName:S.user.name+(asAdmin?(S.user.role==='Admin'?' (Admin)':' (Medienscout)'):''),senderRole:asAdmin?(S.user.role==='Admin'?'Admin':'Medienscout'):'User',text,img,internal:isInternal,ts:now});
  if(!isInternal)await DB.upd('tickets',id,asAdmin?{updatedAt:now,unreadStudent:true,unreadAdmin:false,status:'In Bearbeitung'}:{updatedAt:now,unreadAdmin:true,unreadStudent:false});
  $('#s-c-msg').value='';pendingImg['c-prev']=null;$('#c-prev').innerHTML='';
};

window.saveSlashCommand=async id=>{
  const name=val('sc-name').toLowerCase().replace(/[^a-z0-9_-]/g,'');if(!name)return toast('Bitte einen gültigen Befehlsnamen eingeben.');
  const list=[...(S.settings.slashCommands||defaultSlashCommands())];if(list.some(x=>x.name===name&&x.id!==id))return toast('Diesen Befehl gibt es bereits.');
  let roles=val('sc-roles')==='admin'?['Admin']:val('sc-roles')==='scout'?['Medienscout']:['Admin','Medienscout'];
  const requiresPassword=name==='passwort'?true:$('#sc-password').checked;if(name==='passwort')roles=['Admin'];
  const c={id:id||'cmd-'+Date.now(),name,label:val('sc-label')||('/'+name),message:$('#sc-message').value,image:window._slashImg||'',active:$('#sc-active').checked,requiresPassword,roles};
  const exists=list.some(x=>x.id===id);
  const next=exists?list.map(x=>x.id===id?c:x):[...list,c];
  await DB.set('settings','main',{...S.settings,setupDone:true,slashCommands:next});closeModal();toast('Slash-Befehl gespeichert.');render();

window.deleteSlashCommand=async id=>{if(!confirm('Diesen Slash-Befehl wirklich löschen?'))return;await DB.set('settings','main',{...S.settings,setupDone:true,slashCommands:(S.settings.slashCommands||defaultSlashCommands()).filter(x=>x.id!==id)});toast('Befehl gelöscht.');render();};
window.runSlashCommand=async(ticketId,input)=>{
  if(!S.settings.slashCommandsEnabled)return toast('Slash-Befehle sind deaktiviert.');
  const raw=input.trim().split(/\s+/)[0],name=raw.slice(1).toLowerCase();
  const cmd=(S.settings.slashCommands||defaultSlashCommands()).find(x=>x.name===name&&x.active);if(!cmd)return toast('Unbekannter oder deaktivierter Befehl: '+raw);
  if(name==='passwort'&&S.user?.role!=='Admin')return toast('Der Passwort-Befehl ist ausschließlich Admins vorbehalten.');
  if(!(cmd.roles||['Admin','Medienscout']).includes(S.user.role))return toast('Du darfst diesen Befehl nicht verwenden.');
  if(name==='passwort'&&!S.settings.passwordSupport)return toast('Der Passwort-Support ist deaktiviert.');
  const ticket=await DB.get('tickets',ticketId);if(!ticket)return toast('Ticket nicht gefunden.');
  if(name==='passwort'&&!ticket.passwordReset)return toast('Der Passwort-Befehl kann nur in Passwort-Tickets genutzt werden.');
  const guideText=name==='passwort'?(S.settings.pwGuideText||cmd.message||''):(cmd.message||''),guideImg=name==='passwort'?(S.settings.pwGuideImage||cmd.image||''):(cmd.image||'');
  modal(`<div class="space-y-3"><h3 class="font-bold text-lg">${esc(cmd.label||('/'+name))}</h3><p class="text-xs opacity-70">Empfänger: ${esc(ticket.userName)} · ${esc(ticket.userEmail)}${ticket.passwordPlatform?' · App: <b>'+esc(ticket.passwordPlatform)+'</b>':''}</p>
    ${cmd.requiresPassword?'<label class="block text-xs">Benutzername<input id="sc-username" class="inp mt-1" autocomplete="off" placeholder="Benutzername"></label><label class="block text-xs">Neues Passwort<input id="sc-secret" type="password" autocomplete="new-password" class="inp mt-1" placeholder="Neues Passwort"></label>':''}
    <div class="rounded-xl bg-slate-500/10 p-3 text-sm whitespace-pre-wrap">${esc(guideText)}</div>${guideImg?'<img src="'+guideImg+'" class="rounded-xl max-h-48 object-contain">':''}
    ${cmd.requiresPassword?'<p class="text-xs text-amber-600 dark:text-amber-400">Die Zugangsdaten sind im Chat für Admins nur als schwarzer Balken sichtbar. Der Schüler sieht den Benutzernamen und kann das Passwort einblenden. Danach wird das Ticket automatisch freigegeben und als gelöst markiert.</p>':''}
    <div class="flex gap-2"><button class="btn2 flex-1" onclick="closeModal()">Abbrechen</button><button class="btn flex-1" data-t="${esc(ticketId)}" data-c="${esc(cmd.id)}" onclick="submitSlashCommand(this.dataset.t,this.dataset.c)">${cmd.requiresPassword?'Fertig – Zugangsdaten senden':'Nachricht senden'}</button></div></div>`);
};
window.submitSlashCommand=async(ticketId,cmdId)=>{
  const cmd=(S.settings.slashCommands||defaultSlashCommands()).find(x=>x.id===cmdId);if(!cmd)return toast('Befehl nicht gefunden.');
  const ticket=await DB.get('tickets',ticketId);if(!ticket)return toast('Ticket nicht gefunden.');
  const now=Date.now();
  if(cmd.requiresPassword){
    if(S.user?.role!=='Admin'||!ticket.passwordReset)return toast('Nur Admins dürfen Zugangsdaten in Passwort-Tickets versenden.');
    const secret=$('#sc-secret')?.value||'',username=$('#sc-username')?.value.trim()||'';
    if(!secret)return toast('Bitte das neue Passwort eingeben.');
    await DB.passwordSet(ticketId,{ticketId,uid:ticket.uid,platform:ticket.passwordPlatform||'',username,password:secret,createdAt:now,expiresAt:Timestamp.fromDate(new Date(now+3*24*60*60*1000))});
    await DB.addMsg(ticketId,{from:'scout',senderName:S.user.name+' (Admin)',senderRole:'Admin',text:S.settings.pwGuideText||cmd.message||'Dein Passwort wurde zurückgesetzt. Bitte beachte die folgende Anleitung.',img:S.settings.pwGuideImage||cmd.image||null,internal:false,ts:now,passwordCard:true});
    await DB.upd('tickets',ticketId,{updatedAt:now,unreadStudent:true,unreadAdmin:false,status:'Gelöst',resolvedAt:now,assignedUid:null,assignedName:null});
    closeModal();closeChat();toast('Zugangsdaten gesendet. Ticket gelöst und freigegeben.');return;
  }
  await DB.addMsg(ticketId,{from:'scout',senderName:S.user.name+(S.user.role==='Admin'?' (Admin)':' (Medienscout)'),senderRole:S.user.role,text:cmd.message||'',img:cmd.image||null,internal:false,ts:now});
  await DB.upd('tickets',ticketId,{updatedAt:now,unreadStudent:true,unreadAdmin:false,status:'In Bearbeitung'});closeModal();toast('Nachricht gesendet.');
};

window.loadSecurityIPs=async()=>{
  if(S.user?.role!=='Admin')return toast('Nur Admins dürfen das Sicherheitsprotokoll sehen.');
  S.securityLoading=true;render();
  try{
    const token=await auth.currentUser.getIdToken();
    const res=await fetch('/api/security-check?list=1',{headers:{'Authorization':'Bearer '+token},cache:'no-store'});
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||'Abruf fehlgeschlagen');
    S.securityIPs=data.items||[];S.securityOverrides=data.overrides||[];S.securityBlockedAccounts=data.blockedAccounts||[];S.securityBlockedDevices=data.blockedDevices||[];S.securitySetupRequired=!!data.setupRequired;
    const alertCount=S.securityIPs.filter(x=>x.decision==='review'||x.decision==='blocked').length;
    if(alertCount>S.securityAlertCount)toast(alertCount+' Sicherheitsmeldung(en) im Admin-Terminal.');
    S.securityAlertCount=alertCount;
  }catch(e){toast('IP-Liste konnte nicht geladen werden: '+e.message)}
  finally{S.securityLoading=false;render()}
};
window.clearSecurityLog=async()=>{
  if(!confirm('Wirklich ALLE gespeicherten IP-Adressen und Zugriffe löschen? Das kann nicht rückgängig gemacht werden.'))return;
  try{
    const token=await auth.currentUser.getIdToken();
    const res=await fetch('/api/security-check',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({action:'clear_ips'})});
    const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Löschen fehlgeschlagen (Cloudflare-Funktion kennt "clear_ips" noch nicht?)');
    S.securityIPs=[];S.securityAlertCount=0;toast('Alle IP-Adressen wurden gelöscht.');loadSecurityIPs();
  }catch(e){toast(e.message)}
};
window.securityAction=async(action,values={})=>{
  if(!confirm('Sicherheitsaktion wirklich ausführen?'))return;
  try{
    const token=await auth.currentUser.getIdToken();
    const res=await fetch('/api/security-check',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({action,...values})});
    const data=await res.json();if(!res.ok)throw new Error(data.error||'Aktion fehlgeschlagen');
    toast('Sicherheitsaktion gespeichert.');loadSecurityIPs();
  }catch(e){toast(e.message)}
};

function securityAdminView(){

lass="btn2 !text-rose-500" onclick="securityAction('block_account',{uid:'${esc(uid)}',email:'${esc(x.email||'')}',accountName:'${esc(x.account_name||'')}'})">Account sperren</button>`:''}${x.device_id?`<button class="btn2 !text-rose-500" onclick="securityAction('block_device',{targetDeviceId:'${esc(x.device_id)}'})">Gerät sperren</button>`:''}</div></td></tr>`}).join('')}</tbody></table></div>`:'<div class="p-4 text-sm opacity-70">Noch keine Zugriffe gespeichert.</div>'}</div>

      ${toggleRow('artFeedback','Hilfreich-Abfrage unter Artikeln (👍/👎)','Zeigt unter jeder Anleitung die Frage „Hat dir dieser Artikel geholfen?“')}
      ${toggleRow('board','Schwarzes Brett (Fundsachen & News)','Zeigt auf der Startseite aktuelle Meldungen & digitale Fundsachen')}
      ${toggleRow('surveys','Umfrage-Modul','Schaltet den Bereich für anonyme & nicht-anonyme Umfragen frei')}
      ${toggleRow('activityOverview','Aktivitätsübersicht','Neuigkeiten und veröffentlichte Portal-Aktivitäten anzeigen')}
      ${toggleRow('privateMessages','Private Nachrichten','Direkte Nachrichten zwischen registrierten Nutzern')}
      ${toggleRow('helpCenter','Hilfe-Center','Hilfethemen und Antworten zentral bereitstellen')}
      <section class="glass p-4 space-y-2"><h4 class="font-bold text-sm">Wer darf wem private Nachrichten schreiben?</h4><select class="inp" onchange="setPrivateMessagingPolicy(this.value)"><option value="all" ${S.settings.privateMessagingPolicy==='all'?'selected':''}>Alle dürfen allen schreiben</option><option value="staff" ${S.settings.privateMessagingPolicy==='staff'?'selected':''}>Schüler dürfen nur Medienscouts und Admins schreiben</option></select></section>
    </div>

    <div class="space-y-4">
      <div class="glass p-5 space-y-3">
        <h3 class="font-bold text-base">Schulname & Untertitel</h3>
        <div><label class="text-xs opacity-70 block mb-1">Portal-Titel</label><input id="set-title" class="inp" value="${esc(S.settings.schoolName)}"></div>
        <div><label class="text-xs opacity-70 block mb-1">Untertitel</label><input id="set-sub" class="inp" value="${esc(S.settings.subTitle)}"></div>
        <button class="btn" onclick="saveBrand()">Texte speichern</button>
      </div>

      ${S.user.role==='Admin'?`<div class="glass p-5 space-y-3">
        <h3 class="font-bold text-base">Chat-Befehle (Slash)</h3>
        <p class="text-xs opacity-70">Alles zum Passwort-Zurücksetzen (Apps, Anleitung mit Bild) findest du im Tab „Passwort-Modul“.</p>
        ${toggleRow('slashCommandsEnabled','Eigene Slash-Befehle','Befehle wie /passwort direkt im geöffneten Support-Chat ausführen')}
        <div class="space-y-2"><div class="text-xs opacity-70">Konfigurierte Befehle</div>
          ${(S.settings.slashCommands||defaultSlashCommands()).map(c=>`<div class="rounded-xl border border-slate-200 dark:border-slate-700 p-3 flex items-center gap-2"><div class="flex-1 min-w-0"><div class="font-semibold text-sm">/${esc(c.name)} · ${esc(c.label||'Eigener Befehl')}</div><div class="text-xs opacity-60">${c.active?'Aktiv':'Deaktiviert'} · ${c.requiresPassword?'mit Zugangsdaten-Feldern':'ohne Zugangsdaten-Felder'}</div></div><button class="btn2" data-id="${esc(c.id)}" onclick="openSlashEditor(this.dataset.id)">Bearbeiten</button>${c.name!=='passwort'?`<button class="btn2 !text-rose-500" data-id="${esc(c.id)}" onclick="deleteSlashCommand(this.dataset.id)">Löschen</button>`:''}</div>`).join('')}
          <button class="btn w-full" onclick="openSlashEditor('')"><i data-lucide="plus" class="w-4 h-4"></i>Eigenen Befehl erstellen</button>
        </div>
      </div>`:''}
      ${S.user.role==='Admin'?`<div class="glass p-5 space-y-3"><h3 class="font-bold text-base">Seitenaufruf-Statistik</h3><div class="text-3xl font-bold">${S.pageViews.toLocaleString('de-DE')}</div><p class="text-xs opacity-70">Gezählte Seitenaufrufe durch angemeldete Nutzer seit Aktivierung dieser Statistik. Es werden keine Nutzer-IDs für diese Zählung gespeichert.</p></div>`:''}
      <div class="glass p-5 space-y-4">
        <h3 class="font-bold text-base">Design & Darstellung</h3>
        <div class="flex items-center gap-3">
          ${S.settings.logo?`<img src="${S.settings.logo}" class="w-12 h-12 rounded-xl object-contain border border-slate-500/30">`:`<div class="w-12 h-12 rounded-xl bg-slate-500/10 flex items-center justify-center text-xs opacity-50">Kein Logo</div>`}
          <label class="btn2"><i data-lucide="upload" class="w-4 h-4"></i>Logo hochladen<input type="file" accept="image/*" hidden onchange="uploadAsset(this,'logo',300)"></label>
          ${S.settings.logo?`<button class="btn2 !text-rose-500" onclick="setSet('logo','')">Entfernen</button>`:''}
        </div>
        <div class="flex items-center gap-3 pt-2 border-t border-slate-200 dark:border-slate-800">
          ${S.settings.bg?`<img src="${S.settings.bg}" class="w-16 h-10 rounded-lg object-cover border border-slate-500/30">`:`<div class="w-16 h-10 rounded-lg bg-slate-500/10 flex items-center justify-center text-xs opacity-50">Standard</div>`}
          <label class="btn2"><i data-lucide="image" class="w-4 h-4"></i>Hintergrundbild<input type="file" accept="image/*" hidden onchange="uploadAsset(this,'bg',1400)"></label>
          ${S.settings.bg?`<button class="btn2 !text-rose-500" onclick="setSet('bg','')">Entfernen</button>`:''}
        </div>
      </div>
    </div>
  </div>`,

  pwset:()=>`<div class="max-w-2xl space-y-4">
    <h3 class="font-bold text-base">Passwort-Zurücksetzen-Modul</h3>
    <p class="text-xs opacity-70">Schüler klicken oben auf den Schlüssel, wählen die App und es entsteht ein Ticket, das nur Admins sehen und übernehmen können. Der Admin nutzt im Chat den Befehl <code>/passwort</code>.</p>
    ${toggleRow('passwordSupport','Passwort-Zurücksetzen aktiv','Zeigt Schülern oben den Schlüssel-Button')}
    <div class="glass p-5 space-y-2">
      <div class="text-sm font-semibold">Apps zur Auswahl (eine pro Zeile)</div>
      <textarea id="password-platforms" rows="5" class="inp" placeholder="Untis&#10;Schulportal">${esc(passwordPlatforms().join('\n'))}</textarea>
      <button class="btn2" onclick="savePasswordPlatforms()">Liste speichern</button>
    </div>
    <div class="glass p-5 space-y-3">
      <div class="text-sm font-semibold">Anleitung, die mit /passwort verschickt wird</div>
      <textarea id="pw-guide-text" rows="5" class="inp" placeholder="Schritt-für-Schritt-Anleitung zum Anmelden mit dem neuen Passwort…">${esc(S.settings.pwGuideText||'')}</textarea>
      <button class="btn2" onclick="savePwGuideText()">Text speichern</button>
      <div class="flex items-center gap-3 pt-2 border-t border-slate-200 dark:border-slate-800">
        ${S.settings.pwGuideImage?`<img src="${S.settings.pwGuideImage}" class="h-20 rounded-lg border border-slate-500/30">`:'<div class="text-xs opacity-60">Noch kein Bild</div>'}
        <label class="btn2"><i data-lucide="image" class="w-4 h-4"></i>Bild hochladen<input type="file" accept="image/*" hidden onchange="uploadAsset(this,'pwGuideImage',1000)"></label>
        ${S.settings.pwGuideImage?`<button class="btn2 !text-rose-500" onclick="setSet('pwGuideImage','')">Entfernen</button>`:''}
      </div>
    </div>
    <p class="text-xs opacity-70">Zugangsdaten werden getrennt in der Firestore-Sammlung <b>ticketPasswords</b> gespeichert und erscheinen im Chat nie im Klartext. Admins sehen nur einen schwarzen Balken, der Schüler kann das Passwort einblenden. Die Anzeige läuft nach drei Tagen ab; für die endgültige Löschung muss die Firestore-TTL-Regel für <code>expiresAt</code> aktiviert sein.</p>
  </div>`,

  content:()=>{
    const v=S.edit?.t=='v'?S.videos.find(x=>x.id==S.edit.id):null;
    const a=S.edit?.t=='a'?S.articles.find(x=>x.id==S.edit.id):null;
    return `<div class="grid lg:grid-cols-2 gap-6">
      <div class="space-y-4">
        <div class="glass p-5 space-y-3">
          <h3 class="font-bold">${a?'Artikel bearbeiten':'Artikel / Anleitung veröffentlichen'}</h3>
          <input id="a-title" class="inp" placeholder="Titel des Artikels" value="${a?esc(a.title):''}">
          <div class="grid grid-cols-2 gap-2">
            <select id="a-cat" class="inp">${CATS.map(c=>`<option ${a&&a.cat==c?'selected':''}>${c}</option>`).join('')}</select>
            <select id="a-pub" class="inp">
              <option value="1" ${!a||a.published!==false?'selected':''}>Veröffentlicht</option>
              <option value="0" ${a&&a.published===false?'selected':''}>Entwurf (Versteckt)</option>
            </select>
          </div>
          <label class="flex items-center gap-2 text-xs font-medium cursor-pointer"><input id="a-pin" type="checkbox" class="accent-blue-600" ${a?.pinned?'checked':''}> Oben anpinnen (Wichtiger Beitrag)</label>
          <textarea id="a-body" rows="8" class="inp" placeholder="Inhalt schreiben…&#10;## Zwischenüberschrift&#10;- Aufzählungspunkt">${a?esc(a.body):''}</textarea>
          <div class="flex gap-2">
            <button class="btn2" onclick="previewMediaDraft('articles')"><i data-lucide="eye" class="w-4 h-4"></i>Vorschau</button><button class="btn" onclick="saveArt('${a?.id||''}')">${a?'Aktualisieren':'Veröffentlichen'}</button>
            ${a?`<button class="btn2" onclick="S.edit=null;render()">Abbrechen</button>`:''}
          </div>
        </div>
        <div class="space-y-2">
          ${sortPinned(S.articles).map(x=>`<div class="glass p-3 flex items-center gap-2">
            <button class="btn2 !p-1.5 ${x.pinned?'!text-amber-500':''}" onclick="DB.upd('articles','${x.id}',{pinned:${!x.pinned}})" title="Anpinnen"><i data-lucide="pin" class="w-3.5 h-3.5"></i></button>
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium truncate">${esc(x.title)}</div>
              <div class="text-[11px] opacity-60">${esc(x.cat)} · 👍 ${x.up||0} / 👎 ${x.down||0} · ${x.published===false?'Entwurf':'Öffentlich'}</div>
            </div>
            <button class="btn2" onclick="S.edit={t:'a',id:'${x.id}'};render()">Bearbeiten</button>
            <button class="btn2 !text-rose-500" onclick="delItem('articles','${x.id}')"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
          </div>`).join('')}
        </div>
      </div>

      <div class="space-y-4">
        <div class="glass p-5 space-y-3">
          <h3 class="font-bold">${v?'Video bearbeiten':'YouTube-Video hinzufügen'}</h3>
          <input id="v-url" class="inp" placeholder="YouTube-Link oder Video-ID" value="${v?esc(v.vid):''}">
          <input id="v-title" class="inp" placeholder="Titel des Videos" value="${v?esc(v.title):''}">
          <select id="v-cat" class="inp">${CATS.map(c=>`<option ${v&&v.cat==c?'selected':''}>${c}</option>`).join('')}</select>
          <label class="flex items-center gap-2 text-xs font-medium cursor-pointer"><input id="v-pin" type="checkbox" class="accent-blue-600" ${v?.pinned?'checked':''}> Video oben anpinnen</label>
          <textarea id="v-desc" rows="3" class="inp" placeholder="Kurze Beschreibung">${v?esc(v.desc||''):''}</textarea>
          <div class="flex gap-2">
            <button class="btn2" onclick="previewMediaDraft('videos')"><i data-lucide="eye" class="w-4 h-4"></i>Vorschau</button><button class="btn" onclick="saveVideo('${v?.id||''}')">Speichern</button>
            ${v?`<button class="btn2" onclick="S.edit=null;render()">Abbrechen</button>`:''}
          </div>
        </div>
        <div class="space-y-2">
          ${sortPinned(S.videos).map(x=>`<div class="glass p-3 flex items-center gap-2">
            <button class="btn2 !p-1.5 ${x.pinned?'!text-amber-500':''}" onclick="DB.upd('videos','${x.id}',{pinned:${!x.pinned}})" title="Anpinnen"><i data-lucide="pin" class="w-3.5 h-3.5"></i></button>
            <div class="flex-1 min-w-0"><div class="text-sm font-medium truncate">${esc(x.title)}</div><div class="text-[11px] opacity-60">${esc(x.cat||'Allgemein')}</div></div>
            <button class="btn2" onclick="S.edit={t:'v',id:'${x.id}'};render()">Bearbeiten</button>
            <button class="btn2 !text-rose-500" onclick="delItem('videos','${x.id}')"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
          </div>`).join('')}
        </div>
      </div>
    </div>`;
  },

  feedback:()=>`<div class="space-y-3">
    <div class="text-sm opacity-70">Rückmeldungen der Schüler. Bitte keine Passwörter oder vertraulichen Daten über Feedback senden lassen.</div>
    ${S.feedbackItems.map(f=>`<div class="glass p-4 space-y-2"><div class="flex items-center justify-between gap-2"><b class="text-sm">${esc(f.name||'Schüler')}</b><span class="text-xs opacity-60">${fmt(f.createdAt)}</span></div><p class="text-sm whitespace-pre-wrap">${esc(f.message||'')}</p><div class="flex justify-end"><button class="btn2 !text-rose-500" onclick="delItem('feedback','${f.id}')">Löschen</button></div></div>`).join('')||'<div class="glass p-6 text-center text-sm opacity-60">Noch kein Feedback vorhanden.</div>'}
  </div>`,

  tickets:()=>`<div class="space-y-3">
    <div class="flex items-center justify-between">
      <p class="text-xs opacity-70">Offene und von dir übernommene Tickets. Gelöste Tickets verschwinden hier und sind nur noch für den Schüler sichtbar.</p>
    </div>
    ${deskTickets().map(t=>`<div class="glass p-4 flex items-center justify-between gap-3 flex-wrap">
      <button onclick="openChat('${t.id}',true)" class="flex-1 text-left flex items-center gap-3 cursor-pointer min-w-[240px]">
        ${t.unreadAdmin?`<span class="w-2.5 h-2.5 rounded-full bg-blue-600 shrink-0" title="Neue Nachricht"></span>`:''}
        <div>
          <div class="font-bold text-sm flex items-center gap-2 flex-wrap">
            <span>${esc(t.subject||t.category)}</span>
            ${t.passwordReset?'<span class="text-[10px] px-2 py-0.5 rounded bg-rose-600 text-white">🔴 Passwort-Ticket</span>':''}
            ${t.reopened?'<span class="text-[10px] px-2 py-0.5 rounded bg-amber-500 text-white">Wieder geöffnet</span>':''}
            ${badge(t.status)}
            <span class="text-xs px-2 py-0.5 rounded bg-slate-500/15">${t.assignedName?'Betreut von: '+esc(t.assignedName):'Unzugewiesen'}</span>
          </div>
          <div class="text-xs opacity-70 mt-1">Schüler: <b>${esc(t.userName||'Schüler')}</b> (${esc(t.userEmail||'-')}) · ${esc(t.category)} · ${fmt(t.updatedAt||t.createdAt)}</div>
        </div>
      </button>
      <div class="flex items-center gap-2">
        ${t.assignedUid!=S.user.uid?`<button class="btn2 !text-blue-500" onclick="claimTicket('${t.id}')"><i data-lucide="hand" class="w-4 h-4"></i>Übernehmen</button>`:''}
        <button class="btn2" onclick="openChat('${t.id}',true)"><i data-lucide="maximize-2" class="w-4 h-4"></i>Vollbild-Chat</button>
        ${S.user.role==='Admin'?`<button class="btn2 !text-rose-500" onclick="delItem('tickets','${t.id}')"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`:''}
      </div>
    </div>`).join('')||'<div class="glass p-8 text-center opacity-60">Keine Tickets vorhanden.</div>'}
  </div>`,

  claimed:()=>`<div class="space-y-3">
    <p class="text-xs opacity-70">Von anderen übernommene, noch nicht gelöste Tickets. Nur Admins sehen diesen Bereich und können die Arbeit der Medienscouts kontrollieren.</p>
    ${claimedTickets().map(t=>`<div class="glass p-4 flex items-center justify-between gap-3 flex-wrap">
      <div>
        <div class="font-bold text-sm flex items-center gap-2 flex-wrap"><span>${esc(t.subject||t.category)}</span>${badge(t.status)}<span class="text-xs px-2 py-0.5 rounded bg-slate-500/15">Betreut von: ${esc(t.assignedName||'-')}</span></div>
        <div class="text-xs opacity-70 mt-1">Schüler: <b>${esc(t.userName||'Schüler')}</b> (${esc(t.userEmail||'-')}) · ${esc(t.category)} · ${fmt(t.updatedAt||t.createdAt)}</div>
      </div>
      <div class="flex items-center gap-2">
        <button class="btn2 !text-blue-500" onclick="claimTicket('${t.id}')"><i data-lucide="hand" class="w-4 h-4"></i>Übernehmen</button>
        <button class="btn2" onclick="openChat('${t.id}',true)"><i data-lucide="maximize-2" class="w-4 h-4"></i>Chat ansehen</button>
      </div>
    </div>`).join('')||'<div class="glass p-8 text-center opacity-60">Keine beanspruchten Tickets.</div>'}
  </div>`,

  surveys:()=>`<div class="grid lg:grid-cols-5 gap-6">
    <div class="glass p-5 space-y-3 lg:col-span-2 h-fit">
      <h3 class="font-bold text-base">Neue Umfrage erstellen</h3>
      <input id="sv-title" class="inp" placeholder="Titel der Umfrage" value="${esc(S.svDraft?.title||'')}">
      <textarea id="sv-desc" rows="2" class="inp" placeholder="Kurze Beschreibung">${esc(S.svDraft?.desc||'')}</textarea>
      <label class="flex items-center gap-2 text-xs font-medium cursor-pointer">
        <input id="sv-anon" type="checkbox" class="accent-blue-600" ${S.svDraft?.anon===false?'':'checked'}> Anonyme Umfrage (ohne Namen speichern)
      </label>

      <div class="pt-2 border-t border-slate-200 dark:border-slate-800 space-y-2">
        <div class="text-xs font-bold uppercase opacity-70">Fragen hinzufügen (mit Klassen-Filter)</div>
        <input id="sv-q-text" class="inp" placeholder="Fragetext eingeben…">
        <div class="grid grid-cols-2 gap-2">
          <select id="sv-q-type" class="inp !text-xs">
            <option value="choice">Multiple-Choice</option>
            <option value="text">Freitext-Antwort</option>
          </select>
          <select id="sv-q-class" class="inp !text-xs" title="Nur für bestimmte Klasse anzeigen?">
            ${CLASSES.map(c=>`<option value="${c}">${c=='Alle'?'Für alle Klassen':'Nur '+c}</option>`).join('')}
          </select>
        </div>
        <input id="sv-q-opts" class="inp !text-xs" placeholder="Antworten mit Komma trennen (z.B. Ja, Nein, Manchmal)">
        <button class="btn2 w-full" onclick="addBuilderQ()"><i data-lucide="plus" class="w-4 h-4"></i>Frage zur Liste hinzufügen</button>
      </div>

      <div class="space-y-1.5">
        ${S.surveyBuilderQs.map((q,i)=>`<div class="p-2 rounded-lg bg-slate-500/10 text-xs flex items-center justify-between gap-2">
          <div><b>${i+1}. ${esc(q.text)}</b> <span class="opacity-60">(${esc(q.targetClass)})</span></div>
          <button class="text-rose-500" onclick="removeBuilderQ(${i})">✕</button>
        </div>`).join('')}
      </div>

      <button class="btn w-full" onclick="saveSurvey()"><i data-lucide="check" class="w-4 h-4"></i>Umfrage veröffentlichen</button>
    </div>

    <div class="space-y-4 lg:col-span-3">
      <h3 class="font-bold text-base">Vorhandene Umfragen & Auswertung</h3>
      ${S.surveys.map(s=>`<div class="glass p-4 space-y-3">
        <div class="flex items-center justify-between gap-2 flex-wrap">
          <div>
            <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${s.anonymous?'bg-emerald-500/15 text-emerald-500':'bg-blue-500/15 text-blue-500'}">${s.anonymous?'Anonym':'Mit Name/Account'}</span>
            <h4 class="font-bold text-base mt-1">${esc(s.title)}</h4>
          </div>
          <div class="flex items-center gap-2">
            <button class="btn2 !text-blue-500" onclick="loadSurveyResults('${s.id}')"><i data-lucide="bar-chart-2" class="w-4 h-4"></i>Auswerten & CSV</button>
            <button class="btn2 !text-rose-500" onclick="delItem('surveys','${s.id}')"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
        </div>
      </div>`).join('')||`<div class="glass p-6 text-center opacity-60 text-sm">Noch keine Umfragen erstellt.</div>`}

      ${S.activeResultSurvey?renderSurveyEvaluation():''}
    </div>
  </div>`,

  board:()=>`<div class="grid md:grid-cols-5 gap-6">
    <div class="glass p-5 space-y-3 md:col-span-2 h-fit">
      <h3 class="font-bold">Neuer Eintrag am Schwarzen Brett</h3>
      <select id="b-type" class="inp"><option>Fundsache</option><option>AG-News & Termine</option></select>
      <input id="b-title" class="inp" placeholder="Titel (z.B. AirPods in Raum 204 gefunden)">
      <textarea id="b-text" rows="3" class="inp" placeholder="Details zur Abholung oder zum Termin…"></textarea>
      <div id="b-prev"></div>
      <label class="btn2"><i data-lucide="image" class="w-4 h-4"></i>Foto anhängen<input type="file" accept="image/*" hidden onchange="pick(this,'b-prev',900)"></label>
      <button class="btn w-full" onclick="saveBoardItem()">Veröffentlichen</button>
    </div>
    <div class="space-y-2 md:col-span-3">
      ${S.boardItems.map(b=>`<div class="glass p-4 flex items-center justify-between gap-3">
        <div>
          <span class="text-xs font-bold ${b.type=='Fundsache'?'text-amber-500':'text-emerald-500'}">${esc(b.type)}</span>
          <div class="font-bold text-sm">${esc(b.title)}</div>
          <div class="text-xs opacity-70">${esc(b.text)}</div>
          ${b.img?`<img src="${b.img}" onclick="zoom(this.src)" class="mt-2 rounded-lg max-h-32 cursor-zoom-in">`:''}
        </div>
        <button class="btn2 !text-rose-500" onclick="delItem('board','${b.id}')"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
      </div>`).join('')||`<div class="glass p-8 text-center opacity-60">Keine Einträge vorhanden.</div>`}
    </div>
  </div>`,

  apps:()=>`<div class="space-y-3">
    ${S.apps.map(a=>`<div class="glass p-5 space-y-2">
      <div class="flex items-center justify-between flex-wrap gap-2">
        <div><b class="text-base">${esc(a.name)}</b> <span class="text-xs opacity-70">· ${esc(a.klass)} (${esc(a.email||'-')})</span></div>
        <div class="flex items-center gap-2">${badge(a.status)}<span class="text-xs opacity-60">${fmt(a.createdAt)}</span></div>
      </div>
      <p class="text-sm opacity-85 bg-slate-500/10 p-3 rounded-xl">${esc(a.motivation)}</p>
      <div class="flex flex-wrap gap-2 pt-1">
        <button class="btn2 !text-emerald-500" onclick="acceptApplicant('${a.id}','${a.uid||''}')"><i data-lucide="check" class="w-4 h-4"></i>Annehmen & zum Medienscout machen</button>
        <button class="btn2 !text-amber-500" onclick="DB.upd('applications','${a.id}',{status:'Abgelehnt'})">Ablehnen</button>
        <button class="btn2 !text-rose-500 ml-auto" onclick="delItem('applications','${a.id}')">Löschen</button>
      </div>
    </div>`).join('')||'<div class="glass p-8 text-center opacity-60">Keine Bewerbungen vorhanden.</div>'}
  </div>`,

  team:()=>`<div class="grid lg:grid-cols-5 gap-6">
    <div class="space-y-4 lg:col-span-2">
      <div class="glass p-5 space-y-3">
        <h3 class="font-bold">Einzelnen Account anlegen</h3>
        <input id="u-name" class="inp" placeholder="Vor- und Nachname">
        <input id="u-mail" type="email" class="inp" placeholder="Schul-E-Mail-Adresse">
        <input id="u-pw" type="text" class="inp" placeholder="Start-Passwort (min. 6 Zeichen)">
        <div class="grid grid-cols-2 gap-2">
          <select id="u-class" class="inp">${CLASSES.filter(c=>c!='Alle').map(c=>`<option>${c}</option>`).join('')}</select>
          <select id="u-role" class="inp"><option>Schüler</option><option>Medienscout</option>${S.user.role==='Admin'?'<option>Admin</option>':''}</select>
        </div>
        <button class="btn w-full" onclick="addUser()"><i data-lucide="user-plus" class="w-4 h-4"></i>Account anlegen</button>
      </div>

      <div class="glass p-5 space-y-3">
        <h3 class="font-bold flex items-center gap-2"><i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-500"></i>CSV-Massenimport (Schülerliste)</h3>
        <p class="text-xs opacity-70">Format pro Zeile: <code>Name;Email;Passwort;Klasse;Rolle</code></p>
        <textarea id="csv-input" rows="4" class="inp !text-xs font-mono" placeholder="Max Mustermann;max@schule.de;start123;Klasse 8;Schüler&#10;Lisa Beispiel;lisa@schule.de;start123;Klasse 10;Schüler"></textarea>
        <div class="flex gap-2">
          <label class="btn2 flex-1"><i data-lucide="upload" class="w-4 h-4"></i>CSV-Datei wählen<input type="file" accept=".csv,.txt" hidden onchange="readCsvFile(this)"></label>
          <button class="btn flex-1" onclick="runCsvImport()">Import starten</button>
        </div>
      </div>
    </div>

    <div class="space-y-2 lg:col-span-3">
      <h3 class="font-bold mb-2">Alle Schul-Accounts (${S.users.length})</h3>
      ${S.users.map(u=>`<div class="glass p-3.5 flex items-center justify-between gap-2 flex-wrap">
        <div>
          <div class="font-semibold text-sm">${esc(u.name)} <span class="text-xs opacity-60">(${esc(u.klass||'Keine Klasse')})</span></div>
          <div class="text-xs opacity-60">${esc(u.email)}</div>
        </div>
        <div class="flex items-center gap-2">
          <button class="btn2 !text-blue-500" data-uid="${esc(u.id)}" data-name="${esc(u.name)}" data-email="${esc(u.email)}" onclick="openStartUserTicketModal(this.dataset.uid,this.dataset.name,this.dataset.email)" title="Diesen Schüler direkt anschreiben"><i data-lucide="mail" class="w-3.5 h-3.5"></i>Anschreiben</button>
          ${S.user.role==='Admin'?`<select class="inp !w-auto !py-1.5 !px-2 text-xs" onchange="DB.upd('users','${u.id}',{role:this.value});toast('Rolle aktualisiert')">
            ${['Schüler','Medienscout','Admin'].map(r=>`<option ${u.role==r?'selected':''}>${r}</option>`).join('')}
          </select>`:`<span class="text-xs opacity-60">${esc(u.role||'Schüler')}</span>`}
          ${S.user.role==='Admin'&&u.id!=S.user.uid?`<button class="btn2 !text-rose-500" onclick="delItem('users','${u.id}')"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>`:''}
        </div>
      </div>`).join('')}
    </div>
  </div>`
};

// ---------- Umfrage-Funktionen & CSV-Export ----------
const saveSvDraft=()=>{S.svDraft={title:val('sv-title'),desc:val('sv-desc'),anon:$('#sv-anon')?.checked??true}};
window.addBuilderQ=()=>{
  saveSvDraft();
  const text=val('sv-q-text'),type=val('sv-q-type'),targetClass=val('sv-q-class'),opts=val('sv-q-opts');
  if(!text)return toast('Bitte Fragetext eingeben.');
  const options=type=='choice'?(opts?opts.split(',').map(x=>x.trim()).filter(Boolean):['Ja','Nein']):[];
  S.surveyBuilderQs.push({id:'q'+Date.now(),text,type,targetClass,options});
  render();
};
window.removeBuilderQ=i=>{saveSvDraft();S.surveyBuilderQs.splice(i,1);render()};

window.saveSurvey=async()=>{
  const title=val('sv-title'),desc=val('sv-desc'),anonymous=$('#sv-anon')?.checked??true;
  if(!title)return toast('Bitte einen Titel für die Umfrage eingeben.');
  if(!S.surveyBuilderQs.length)return toast('Bitte mindestens eine Frage hinzufügen (Button „Frage zur Liste hinzufügen“).');
  try{
    await DB.add('surveys',{title,desc,anonymous,questions:S.surveyBuilderQs,active:true,createdAt:Date.now()});
  }catch(e){return toast('Fehler beim Speichern: '+(e.code||e.message))}
  S.surveyBuilderQs=[];S.svDraft=null;toast('Umfrage veröffentlicht!');render();
};

window.loadSurveyResults=sid=>{
  const sv=S.surveys.find(x=>x.id==sid);if(!sv)return;
  S.activeResultSurvey=sv;S.surveyResults=[];
  S.unsubSurveyResp&&S.unsubSurveyResp();
  S.unsubSurveyResp=DB.surveyResp(sid,res=>{S.surveyResults=res;render()});
  render();
};

function renderSurveyEvaluation(){
  const sv=S.activeResultSurvey,res=S.surveyResults||[];
  return `<div class="glass p-5 space-y-4 border-2 border-blue-500/40">
    <div class="flex items-center justify-between flex-wrap gap-2">
      <div>
        <h4 class="font-bold text-lg">Auswertung: ${esc(sv.title)}</h4>
        <div class="text-xs opacity-70">${res.length} abgegebene Stimmen</div>
      </div>
      <button class="btn" onclick="exportSurveyCsv()"><i data-lucide="download" class="w-4 h-4"></i>Als Excel-CSV herunterladen</button>
    </div>

    <div class="space-y-4">
      ${(sv.questions||[]).map(q=>{
        const counts={};
        res.forEach(r=>{const a=r.answers?.[q.id];if(a)counts[a]=(counts[a]||0)+1});
        return `<div class="p-3.5 rounded-xl bg-slate-500/10 space-y-2">
          <div class="font-semibold text-sm">${esc(q.text)} <span class="text-xs opacity-60">(${esc(q.targetClass||'Alle')})</span></div>
          ${q.type=='choice'
            ? (q.options||[]).map(opt=>{
                const n=counts[opt]||0,pct=res.length?Math.round((n/res.length)*100):0;
                return `<div class="text-xs space-y-1">
                  <div class="flex justify-between"><span>${esc(opt)}</span><b>${n} (${pct}%)</b></div>
                  <div class="w-full h-2 rounded-full bg-slate-500/20 overflow-hidden"><div class="h-full bg-blue-600" style="width:${pct}%"></div></div>
                </div>`;
              }).join('')
            : `<div class="text-xs space-y-1 max-h-32 overflow-auto">${res.map(r=>r.answers?.[q.id]?`<div class="p-1.5 rounded bg-white/50 dark:bg-slate-800"><b>${esc(r.userName)} (${esc(r.klass)}):</b> ${esc(r.answers[q.id])}</div>`:'').join('')||'Keine Freitext-Antworten'}</div>`}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

window.exportSurveyCsv=()=>{
  const sv=S.activeResultSurvey,res=S.surveyResults||[];if(!sv)return;
  const qs=sv.questions||[];
  const header=['Zeitpunkt','Klasse','Teilnehmer','E-Mail',...qs.map(q=>q.text)];
  const rows=res.map(r=>[fmt(r.ts),r.klass||'-',r.userName||'Anonym',r.userEmail||'-',...qs.map(q=>r.answers?.[q.id]||'')]);
  const csv='\uFEFF'+[header,...rows].map(row=>row.map(cell=>`"${String(cell??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Umfrage_${sv.title.replace(/\W+/g,'_')}.csv`;a.click();
};

// ---------- Schwarzes Brett & CSV-Account-Import ----------
window.saveBoardItem=async()=>{
  const type=val('b-type'),title=val('b-title'),text=val('b-text'),img=pendingImg['b-prev']||null;
  if(!title||!text)return toast('Bitte Titel und Text eingeben.');
  try{await DB.add('board',{type,title,text,img,createdAt:Date.now()})}catch(e){return toast('Fehler beim Speichern: '+(e.code||e.message))}
  pendingImg['b-prev']=null;
  toast('Am Schwarzen Brett veröffentlicht.');render(true);
};

window.readCsvFile=inp=>{
  if(!inp.files[0])return;
  const r=new FileReader();
  r.onload=()=>{if($('#csv-input'))$('#csv-input').value=r.result};
  r.readAsText(inp.files[0]);
};

window.runCsvImport=async()=>{
  const raw=val('csv-input');if(!raw)return toast('Bitte CSV-Daten einfügen.');
  const lines=raw.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let ok=0;
  toast('Import läuft… bitte kurz warten.');
  const sec=initializeApp(firebaseConfig,'csv'+Date.now()),sa=getAuth(sec);
  for(const line of lines){
    const [name,email,pw,klass,role]=line.split(/[;,]/).map(x=>x?.trim());
    if(!name||!email||!pw||pw.length<6)continue;
    const r=S.user.role==='Admin'?(role||'Schüler'):(role==='Admin'?'Schüler':(role||'Schüler'));
    try{
      const c=await createUserWithEmailAndPassword(sa,email,pw);
      await DB.set('users',c.user.uid,{name,email,klass:klass||'Klasse 8',role:r,createdAt:Date.now()});
      await signOut(sa);ok++;
    }catch(e){}
  }
  toast(`${ok} Accounts erfolgreich importiert!`);
  if($('#csv-input'))$('#csv-input').value='';
};

// ---------- Standard Admin-Aktionen ----------
window.acceptApplicant=async(appId,uid)=>{
  await DB.upd('applications',appId,{status:'Angenommen'});
  if(uid)await DB.upd('users',uid,{role:'Medienscout'}).catch(()=>{});
  toast('Bewerbung angenommen & als Medienscout freigeschaltet!');
};
window.delItem=async(c,id)=>{if(confirm('Diesen Eintrag wirklich löschen?'))await DB.del(c,id)};
window.previewMediaDraft=kind=>{
  if(kind==='videos'){
    const id=ytId(val('v-url')),title=val('v-title'),desc=val('v-desc');
    if(!id||!title)return toast('Bitte gültigen YouTube-Link und Titel eingeben.');
    modal(`<div class="space-y-3"><div class="flex justify-between items-center"><h2 class="font-bold text-lg">Video-Vorschau</h2><button class="btn2" onclick="closeModal()">Schließen</button></div><div class="aspect-video bg-black rounded-xl overflow-hidden"><iframe class="w-full h-full" src="https://www.youtube-nocookie.com/embed/${id}" allowfullscreen></iframe></div><h3 class="font-bold text-xl">${esc(title)}</h3><p class="text-sm opacity-75 whitespace-pre-wrap">${esc(desc)}</p></div>`);
    const panel=$('#modal .max-w-xl');if(panel)panel.classList.replace('max-w-xl','max-w-4xl');
  }else{
    const title=val('a-title'),body=val('a-body');
    if(!title||!body)return toast('Bitte Titel und Artikeltext eingeben.');
    modal(`<div class="space-y-4"><div class="flex justify-between items-center"><h2 class="font-bold text-lg">Artikel-Vorschau</h2><button class="btn2" onclick="closeModal()">Schließen</button></div><div class="text-xs text-blue-600">${esc(val('a-cat'))}</div><h1 class="text-2xl font-bold">${esc(title)}</h1><div class="prose max-w-none">${fmtArticle(body)}</div></div>`);
    const panel=$('#modal .max-w-xl');if(panel)panel.classList.replace('max-w-xl','max-w-3xl');
  }
};
window.saveVideo=async id=>{
  const vid=ytId(val('v-url'));if(!vid)return toast('Ungültiger YouTube-Link.');
  const d={vid,title:val('v-title'),cat:val('v-cat'),desc:val('v-desc'),pinned:$('#v-pin')?.checked||false,published:true};
  if(!d.title)return toast('Titel fehlt.');
  id?await DB.upd('videos',id,d):await DB.add('videos',{...d,createdAt:Date.now()});
  S.edit=null;toast('Video gespeichert.');render();
};
window.saveArt=async id=>{
  const d={title:val('a-title'),cat:val('a-cat'),body:val('a-body'),pinned:$('#a-pin')?.checked||false,published:val('a-pub')==='1'};
  if(!d.title||!d.body)return toast('Bitte Titel und Inhalt ausfüllen.');
  id?await DB.upd('articles',id,d):await DB.add('articles',{...d,up:0,down:0,createdAt:Date.now()});
  S.edit=null;toast('Artikel gespeichert.');render();
};
window.addUser=async()=>{
  const email=val('u-mail'),name=val('u-name'),pw=val('u-pw'),klass=val('u-class');
  let role=val('u-role');if(S.user.role!=='Admin'&&role==='Admin')role='Schüler';
  if(!email||!name||pw.length<6)return toast('Bitte alle Felder korrekt ausfüllen.');
  try{
    const sec=initializeApp(firebaseConfig,'sec'+Date.now()),sa=getAuth(sec);
    const c=await createUserWithEmailAndPassword(sa,email,pw);
    await DB.set('users',c.user.uid,{email,name,klass,role,createdAt:Date.now()});
    await signOut(sa);toast('Account angelegt.');
    ['u-mail','u-name','u-pw'].forEach(i=>$('#'+i).value='');
  }catch(e){toast('Fehler: '+e.code)}
};

// ---------- Ersteinrichtung ----------
window.setup=async()=>{
  try{
    const email=val('l-mail'),pw=val('l-pw');
    const c=await createUserWithEmailAndPassword(auth,email,pw);
    await DB.set('users',c.user.uid,{email,name:'Haupt-Admin',klass:'Team',role:'Admin',createdAt:Date.now()});
    await DB.set('settings','main',{...S.settings,setupDone:true});
    const now=Date.now();
    await DB.add('articles',{cat:'Schul-IT & Accounts',title:'Willkommen auf dem neuen Hilfe-Portal unserer Schule',pinned:true,published:true,up:12,down:0,createdAt:now,body:"## Schnelle Hilfe von Schülern für Schüler\nAuf dieser Webseite findest du wichtige Anleitungen, Sicherheitstipps und Erklärvideos rund um dein digitales Schulleben.\n\n- Lies dir Artikel in Ruhe durch und gib uns unten kurzes Feedback\n- Öffne bei Problemen ein Ticket und chatte im Vollbildmodus mit uns\n- Nimm an aktuellen Umfragen für deine Jahrgangsstufe teil"});
    await DB.add('videos',{vid:'Y3SFXvtfZQQ',title:'Sicher im Netz – Die wichtigsten Grundlagen',cat:'Passwörter & Sicherheit',desc:'So schützt du deine Accounts vor fremdem Zugriff.',pinned:true,published:true,createdAt:now});
    await DB.add('board',{type:'AG-News & Termine',title:'Offene Medienscout-Sprechstunde',text:'Jeden Dienstag in der 1. großen Pause sind wir auch persönlich für euch da!',createdAt:now});
    closeModal();toast('Admin & Startdaten erfolgreich angelegt!');
  }catch(e){toast('Fehler: '+e.code)}
};

setInterval(async()=>{const active=auth.currentUser;if(!active)return;try{const token=await active.getIdToken();const res=await fetch('/api/security-check?heartbeat=1&deviceId='+encodeURIComponent(getSecurityDeviceId()),{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(res.status===403){const info=await res.json().catch(()=>({}));if(info.blocked){showSecurityBlock(info.countryName,info.error||'Dieser Account oder Zugriff wurde gesperrt.');return}}if(res.ok&&securityBlockSticky){securityBlockSticky=false;clearSecurityBlock()}if(!res.ok)console.warn('Regelmäßige Sicherheitsprüfung vorübergehend nicht verfügbar; Sitzung bleibt bestehen.',res.status)}catch(e){console.warn('Regelmäßige Sicherheitsprüfung fehlgeschlagen; Sitzung bleibt bestehen:',e)}},30000);
Object.assign(window,{S,DB,val,render});
const appRoot=document.getElementById('app');if(appRoot)appRoot.style.display='none';
render();
</script>
